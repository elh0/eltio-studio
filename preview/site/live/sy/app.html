<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Eltio Systems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&family=Inter+Tight:wght@500&display=swap">
<style>
/* Eltio Systems client app. Same rules as Charlie's onboarding: one Geist Mono size, Inter Tight only for the question,
   sentence case, soft rounded rows, one colour per part. Content lives in the objects at the top of the script. */
:root{--ink:#0B0B0A;--white:#fff;--chrome:#F3F3F0;--chrome-fg:#0B0B0A;--grey:#8A8A83;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;--disp:"Inter Tight",-apple-system,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--chrome:#1a1a18;--chrome-fg:#F3F3F0}}
:root[data-theme="dark"]{--chrome:#1a1a18;--chrome-fg:#F3F3F0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--chrome);color:var(--chrome-fg)}
body{font:400 13px/1.45 var(--mono);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
p{margin:0}
.wrap{display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:28px 16px}
.side{width:260px;display:grid;gap:14px;padding-top:8px}
.side .q{color:var(--grey)}
.side .jump{display:grid;gap:4px}
.side .jump button{background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;color:var(--grey)}
.side .jump button.on{color:var(--chrome-fg)}
.side .jump button:hover{color:var(--chrome-fg)}
/* app frame */
.app{--bg:#fff;--fg:#0B0B0A;--q:rgba(11,11,10,.5);--hr:rgba(11,11,10,.09);--fill:#F5F5F3;--c:#DCE8D6;--d:#121211;
  position:relative;width:390px;height:min(820px,calc(100vh - 56px));min-height:640px;background:var(--bg);color:var(--fg);border-radius:32px;border:1px solid rgba(128,128,128,.28);overflow:hidden;display:flex;flex-direction:column}
.app[data-p="you"]{--c:#DCE8D6;--d:#121211}
.app[data-p="work"]{--c:#F6C99C;--d:#85691A}
.app[data-p="services"]{--c:#D6E4F1;--d:#3C6286}
.app[data-p="accounts"]{--c:#F3D8CE;--d:#96503F}
.app[data-p="rules"]{--c:#E4DDF0;--d:#5E4B86}
.app[data-p="start"]{--c:#E6E3DC;--d:#5C574C}
@media (max-width:720px){.wrap{padding:0;display:block}.side{display:none}.app{width:100%;height:100vh;height:100dvh;min-height:0;border-radius:0;border:0}}
.scr{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 20px 20px;display:flex;flex-direction:column;gap:18px}
.q{color:var(--q)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:28px}
.lnk{background:none;border:0;padding:0;cursor:pointer;color:var(--q)}
.lnk:hover{color:var(--fg)}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:4px;border-radius:4px;background:var(--hr);transition:background .4s}
.segs i.on{background:var(--d)}
h1{font:500 30px/1.08 var(--disp);letter-spacing:-.02em;margin:0}
h2{font:500 24px/1.12 var(--disp);letter-spacing:-.015em;margin:0}
.part{display:flex;align-items:center;gap:8px;color:var(--q)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);flex:none}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--hr);background:var(--bg);padding:8px 13px;border-radius:999px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--c);border-color:var(--c)}
.rows{display:grid;gap:6px}
.row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:13px 14px;border:0;border-radius:12px;background:var(--fill);text-align:left;cursor:pointer;transition:background .25s}
.row[aria-pressed="true"]{background:var(--c)}
.row .sub{grid-column:1/-1;color:var(--q)}
.row[aria-pressed="true"] .sub{color:rgba(11,11,10,.62)}
.row.soon{cursor:default;opacity:.55}
.tog{width:34px;height:20px;border-radius:999px;background:var(--hr);position:relative;transition:background .25s;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .25s}
[aria-pressed="true"] .tog,.tog.on{background:var(--d)}
[aria-pressed="true"] .tog::after,.tog.on::after{transform:translateX(14px)}
.tog.lock{opacity:.6}
.field{display:grid;gap:6px}
.field input{border:0;border-radius:12px;background:var(--fill);padding:13px 14px;outline:none;width:100%}
.field input:focus{box-shadow:0 0 0 1.5px var(--d)}
.foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--hr);background:var(--bg)}
.btn{border:1px solid var(--hr);background:var(--bg);padding:12px 20px;border-radius:999px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.wide{flex:1;text-align:center}
.sum{display:grid;gap:0;border-radius:12px;background:var(--fill);overflow:hidden}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--hr)}
.sum div:last-child{border-bottom:0}
.note{padding:12px 14px;border:1px dashed var(--hr);border-radius:12px;color:var(--q)}
.slider{display:grid;gap:8px}
.slider .ends{display:flex;justify-content:space-between;color:var(--q)}
input[type=range]{width:100%;accent-color:var(--d)}
.quote{padding:12px 14px;border-radius:12px;background:var(--c);white-space:pre-wrap}
/* home */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--hr);padding:6px 6px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.tabs button{background:none;border:0;padding:8px 0;cursor:pointer;color:var(--q);display:grid;justify-items:center;gap:5px}
.tabs button.on{color:var(--fg)}
.tabs button i{width:6px;height:6px;border-radius:50%;background:transparent}
.tabs button.on i{background:var(--fg)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kpi{background:var(--fill);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.kpi b{font:500 20px/1.15 var(--disp);letter-spacing:-.01em}
.status{color:var(--q);white-space:nowrap}
.status.live{color:var(--fg)}
.status.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#121211;margin-right:6px;vertical-align:1px}
.sheet{position:absolute;inset:auto 0 0 0;background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.14);padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:82%;overflow-y:auto;z-index:20}
.sheet.on{transform:none}
.grab{width:36px;height:4px;border-radius:4px;background:var(--hr);justify-self:center}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .3s;z-index:19}
.shade.on{opacity:1;pointer-events:auto}
.banner{position:absolute;left:12px;right:12px;top:12px;z-index:30;background:var(--fg);color:var(--bg);padding:11px 14px;border-radius:12px;transform:translateY(calc(-100% - 24px));visibility:hidden;transition:transform .3s,visibility .3s}
.banner.on{transform:none;visibility:visible}
:focus-visible{outline:2px solid #3C6286;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* view switch + desktop portal */
.viewbar{display:flex;gap:4px;padding:3px;background:rgba(128,128,128,.12);border-radius:999px;width:max-content}
.viewbar button{background:none;border:0;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--grey)}
.viewbar button.on{background:var(--chrome-fg);color:var(--chrome)}
.app.desk{width:min(1120px,calc(100vw - 360px));border-radius:18px}
.app.desk.flow .scr{padding:36px max(24px,calc(50% - 320px)) 24px}
.app.desk.flow .foot{padding-left:max(24px,calc(50% - 320px));padding-right:max(24px,calc(50% - 320px))}
.app.desk:not(.flow) .scr{padding:0}
.dk{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100%}
.dnav{border-right:1px solid var(--hr);padding:22px 14px;display:grid;gap:2px;align-content:start;position:sticky;top:0;height:max-content}
.dnav .who{padding:0 10px 16px;display:grid;gap:2px}
.dnav button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--q);display:flex;justify-content:space-between}
.dnav button.on{background:var(--fill);color:var(--fg)}
.dnav button:hover{color:var(--fg)}
.dmain{padding:24px 28px 40px;display:flex;flex-direction:column;gap:18px;min-width:0}
.two{display:grid;gap:18px}
.grp{display:grid;gap:12px;align-content:start}
.two>div{display:grid;gap:12px;align-content:start}
.app.desk .two{grid-template-columns:1fr 1fr}
.app.desk .kpis{grid-template-columns:repeat(4,1fr)}
.app.desk .svcgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.app.desk .svcgrid>div{display:grid;gap:12px;align-content:start}
.big{font:500 34px/1.05 var(--disp);letter-spacing:-.02em}
.clock{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.clock div{background:var(--fill);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.clock b{font:500 20px/1.15 var(--disp)}
.warn{padding:11px 14px;border-radius:12px;background:#F6C99C}
.drop{display:grid;gap:6px;justify-items:center;text-align:center;padding:22px 14px;border:1px dashed var(--hr);border-radius:12px;color:var(--q);cursor:pointer}
.drop input{display:none}
.ckl{border-radius:12px;background:var(--fill);overflow:hidden}
.chk{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 14px;border-bottom:1px solid var(--hr)}
.chk:last-child{border-bottom:0}
.chk i{width:14px;height:14px;border-radius:50%;border:1px solid var(--hr);margin-top:2px}
.chk.ok i{background:#121211;border-color:#121211}
.chk.wait i{background:#F6C99C;border-color:#F0A77A}
/* layouts + tour + guide */
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.app.desk .thumbs{grid-template-columns:repeat(4,1fr)}
.thumb{border:0;background:var(--fill);border-radius:14px;padding:10px;display:grid;gap:8px;text-align:left;cursor:pointer;transition:background .25s}
.thumb[aria-pressed="true"]{background:var(--c)}
.thumb .q{font-size:12px;line-height:1.35}
.mini{background:#fff;border-radius:10px;height:150px;padding:10px 9px;display:grid;gap:5px;align-content:start;box-shadow:inset 0 0 0 1px var(--hr);overflow:hidden}
.mini i{display:block;height:8px;border-radius:3px;background:var(--hr);transform-origin:left;animation:draw .7s cubic-bezier(.2,.8,.2,1) both}
.mini i.h{height:9px;width:58%;background:rgba(11,11,10,.28)}
.mini i.k{height:24px}.mini i.c{height:20px;background:#F6C99C}.mini i.r{height:14px;background:#F3D8CE}.mini i.j{height:14px;background:#D6E4F1}.mini i.g{height:14px;background:#DCE8D6}
.mini .kk{display:grid;grid-template-columns:1fr 1fr;gap:4px}
@keyframes draw{from{transform:scaleX(0);opacity:0}}
.ill{height:170px;border-radius:14px;background:var(--fill);position:relative;overflow:hidden}
.ill *{position:absolute}
.ill .card{left:16px;top:22px;width:46%;height:52px;border-radius:10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:9px 10px;font-size:11px;line-height:1.3}
.ill .tray{right:16px;bottom:18px;width:42%;height:76px;border-radius:12px;border:1px dashed rgba(11,11,10,.25);padding:8px 10px;font-size:11px;color:var(--q)}
.ill .press{right:16px;top:22px;padding:7px 14px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:11px}
.t1 .card{animation:t1card 4s ease-in-out infinite}.t1 .press{animation:t1press 4s ease-in-out infinite}
@keyframes t1card{0%,10%{transform:none}40%,100%{transform:translate(calc(100% + 20px),78px) scale(.8)}}
@keyframes t1press{0%,55%{transform:scale(1);opacity:.35}65%{transform:scale(.92);opacity:1}75%,100%{transform:scale(1);opacity:1}}
.ill .ck{left:16px;right:16px;height:26px;border-radius:8px;background:#fff;padding:5px 10px 5px 34px;font-size:11px;line-height:16px}
.ill .ck b{left:10px;top:6px;width:14px;height:14px;border-radius:50%;border:1px solid var(--hr);font-weight:400}
.t2 .ck:nth-child(1) b{animation:tk 5s infinite;animation-delay:0s}.t2 .ck:nth-child(2) b{animation:tk 5s infinite;animation-delay:.8s}.t2 .ck:nth-child(3) b{animation:tk 5s infinite;animation-delay:1.6s}.t2 .ck:nth-child(4) b{animation:tk2 5s infinite;animation-delay:2.4s}
@keyframes tk{0%{background:transparent;border-color:var(--hr)}10%,85%{background:#121211;border-color:#121211}100%{background:transparent}}
@keyframes tk2{0%{background:transparent}10%,85%{background:#F6C99C;border-color:#F0A77A}100%{background:transparent}}
.ill .bub{left:16px;top:24px;max-width:56%;padding:8px 11px;border-radius:14px 14px 14px 4px;background:#DCE8D6;font-size:11px;line-height:1.3}
.ill .fold{right:16px;bottom:18px;width:38%;height:64px;border-radius:6px 12px 12px 12px;background:#D6E4F1;padding:26px 10px 0;font-size:11px}
.t3 .bub{animation:t3 4s ease-in-out infinite}
@keyframes t3{0%,15%{transform:none;opacity:1}55%{transform:translate(110%,70px) scale(.45);opacity:0}56%,100%{transform:none;opacity:0}100%{opacity:1}}
.ill .bar{left:16px;right:16px;top:64px;height:14px;border-radius:7px;background:#fff}
.ill .fill{left:16px;top:64px;height:14px;border-radius:7px;background:#121211;animation:t4 5s linear infinite}
.ill .mark{top:56px;left:calc(16px + (100% - 32px)*.72);width:1px;height:30px;background:rgba(11,11,10,.4)}
.ill .lab{font-size:11px;color:var(--q)}
@keyframes t4{0%{width:0;background:#121211}70%{background:#121211}72%,90%{width:calc((100% - 32px)*.9);background:#F0A77A}100%{width:calc((100% - 32px)*.9);background:#F0A77A}}
.ill .qq{left:16px;top:22px;padding:8px 11px;border-radius:14px 14px 14px 4px;background:#fff;font-size:11px;max-width:70%;animation:fade 5s infinite both}
.ill .aa{right:16px;top:70px;padding:8px 11px;border-radius:14px 14px 4px 14px;background:#E4DDF0;font-size:11px;max-width:72%;line-height:1.3;animation:fade2 5s infinite both}
@keyframes fade{0%{opacity:0;transform:translateY(6px)}10%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes fade2{0%,30%{opacity:0;transform:translateY(6px)}42%,90%{opacity:1;transform:none}100%{opacity:0}}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:6px;height:6px;border-radius:50%;background:var(--hr)}.dots i.on{background:var(--fg)}
.new{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--fill);color:var(--q);margin-left:6px;vertical-align:1px}
/* v5: cards on a soft sky that follows the time of day */
.app{--sky1:#DCE8F3;--sky2:#EEF2EE;--paper:#F7F7F4}
.app[data-sky="dawn"]{--sky1:#F8DCCB;--sky2:#F6EDE2}
.app[data-sky="day"]{--sky1:#D3E3F2;--sky2:#EAF1EC}
.app[data-sky="dusk"]{--sky1:#F3CDBB;--sky2:#E9DCEA}
.app[data-sky="night"]{--sky1:#CFD3E8;--sky2:#E8E7EF}
.app:not(.flow) .scr{background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 260px,var(--paper) 560px);transition:background .6s}
.app.flow .scr{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 55%,#fff) 0,#fff 300px)}
.app:not(.flow) .row,.app:not(.flow) .kpi,.app:not(.flow) .sum,.app:not(.flow) .clock div,.app:not(.flow) .ckl{background:#fff;box-shadow:0 1px 2px rgba(11,11,10,.04),0 0 0 1px rgba(11,11,10,.05)}
.sheet .sum,.sheet .ckl{background:var(--fill);box-shadow:none}
.app:not(.flow) .row{border-radius:16px;padding:14px 16px}
.app:not(.flow) .kpi{border-radius:16px}
.app:not(.flow) .sum{border-radius:16px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--q);white-space:nowrap}
.app:not(.flow) .tabs{background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabs{grid-template-columns:repeat(4,1fr)!important}
.tabs button{position:relative}
.badge{position:absolute;top:2px;left:calc(50% + 10px);min-width:16px;height:16px;border-radius:8px;background:#F0A77A;color:#fff;font-size:10px;line-height:16px;padding:0 4px}
.me{width:30px;height:30px;border-radius:50%;border:0;background:#fff;box-shadow:0 0 0 1px rgba(11,11,10,.08);cursor:pointer}
.app.desk .me{display:none}
.top.has-me>span:nth-child(2){display:none}
.seg{display:flex;gap:4px;padding:3px;background:rgba(255,255,255,.7);border-radius:999px;width:max-content;box-shadow:0 0 0 1px rgba(11,11,10,.05)}
.seg button{border:0;background:none;padding:7px 13px;border-radius:999px;cursor:pointer;color:var(--q)}
.seg button.on{background:var(--fg);color:var(--bg)}
.act{position:sticky;bottom:-20px;margin:0 -20px -20px;padding:14px 20px 18px;display:flex;gap:14px;align-items:center;background:linear-gradient(180deg,rgba(247,247,244,0),var(--paper) 40%)}
.app.desk .act{position:static;margin:0;padding:0;background:none;max-width:360px}

.dnav button.on{background:#fff}
/* v6: one palette, borrowed from Aglo. The sky is the only colour; everything else is ink, paper and one grey.
   Ink #121211 · paper #F2F2EF · grey 52% ink · line 12% ink · glow #F6C99C (waiting) · ember #F0A77A (needs you) */
.app{--fg:#121211;--q:rgba(18,18,17,.52);--hr:rgba(18,18,17,.12);--fill:rgba(18,18,17,.05);--paper:#F2F2EF;--glow:#F6C99C;--ember:#F0A77A;
  --glass:rgba(255,255,255,.58);--glass-hi:rgba(255,255,255,.78);--rim:rgba(255,255,255,.75);--c:var(--sky1);--d:#121211}
.app,.app[data-p]{--c:var(--sky1);--d:#121211}
.app[data-sky="dawn"]{--sky1:#E7C9B6;--sky2:#F6D9BE;--sun:rgba(246,201,156,.75)}
.app[data-sky="day"]{--sky1:#B9CDE4;--sky2:#E3EDF5;--sun:rgba(239,221,198,.7)}
.app[data-sky="dusk"]{--sky1:#C6B2B4;--sky2:#F3C3A2;--sun:rgba(240,167,122,.55)}
.app[data-sky="night"]{--sky1:#A3A6C0;--sky2:#D8C3C0;--sun:rgba(185,138,134,.35)}
.app .scr,.app.flow .scr,.app:not(.flow) .scr{background:radial-gradient(120% 60% at 85% -10%,var(--sun),transparent 60%),linear-gradient(180deg,var(--sky1) 0,var(--sky2) 240px,var(--paper) 560px);background-attachment:local}
.app.flow .scr{background:radial-gradient(120% 50% at 85% -10%,var(--sun),transparent 60%),linear-gradient(180deg,var(--sky1) 0,var(--sky2) 180px,var(--paper) 420px)}
.app{background:var(--paper)}
.foot,.tabs,.app:not(.flow) .tabs{background:rgba(242,242,239,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--rim)}
/* glass surfaces */
.row,.kpi,.sum,.clock div,.ckl,.thumb,.field input,.app:not(.flow) .row,.app:not(.flow) .kpi,.app:not(.flow) .sum,.app:not(.flow) .clock div,.app:not(.flow) .ckl{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px var(--rim),0 1px 2px rgba(18,18,17,.04);border-radius:16px}
.row:hover{background:var(--glass-hi)}
.row[aria-pressed="true"],.thumb[aria-pressed="true"],.pill[aria-pressed="true"]{background:#121211;color:#F2F2EF;border-color:#121211;box-shadow:none}
.row[aria-pressed="true"] .sub,.row[aria-pressed="true"] .q,.thumb[aria-pressed="true"] .q{color:rgba(242,242,239,.6)}
.row[aria-pressed="true"] .tog{background:rgba(242,242,239,.3)}
.pill{background:var(--glass);border:1px solid var(--rim);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.btn{background:var(--glass);border:1px solid var(--rim);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 1px 2px rgba(18,18,17,.05)}

 if(d.wait!=null){var x=WAITING[+d.wait];openSheet('<h2>'+esc(x.t)+'</h2><p class="q">'+esc(x.s)+'</p>'+(x.draft?'<p class="quote">'+esc(x.draft)+'</p>':'')+'<div style="display:flex;gap:10px">'+(x.k==="chase"||x.k==="holds"||x.k==="agent"?'<button class="btn solid wide" data-did="'+d.wait+'">Open in your inbox</button>':x.k==="permits"?'<button class="btn solid wide" data-did="'+d.wait+'">Open the form</button>':'<button class="btn solid wide" data-did="'+d.wait+'">Mark as done</button>')+'<button class="btn" data-close>Later</button></div>'+(x.k==="chase"?'<p class="q">You send it from your own email. We just wrote it.</p>':''));return}
 if(d.did!=null){S.done[d.did]=1;closeSheet();render();banner(WAITING[+d.did].k==="chase"||WAITING[+d.did].k==="holds"||WAITING[+d.did].k==="agent"?"Draft opened in your inbox (sample)":WAITING[+d.did].k==="permits"?"Form opened, pre-filled (sample)":"Done");return}
 if(d.sv){var s=SERVICES.filter(function(z){return z.id===d.sv})[0],on=!!S.on[s.id];
   openSheet('<h2>'+esc(s.name)+'</h2><p class="q">'+esc(s.line)+'</p><div class="sum"><div><span class="q">Status</span><span>'+(on?'On':'Not set up')+'</span></div><div><span class="q">Runs</span><span>'+esc(s.runs)+'</span></div>'+(on?'<div><span class="q">Last run</span><span>Today, all fine</span></div>':'<div><span class="q">Setup from</span><span>'+esc(s.from)+'</span></div>')+'</div><div style="display:flex;gap:10px">'+(on?'<button class="btn wide" data-off="'+s.id+'">Pause this</button>':'<button class="btn solid wide" data-add="'+s.id+'">Ask us to add it</button>')+'<button class="btn" data-close>Close</button></div>');return}
 if(d.off){delete S.on[d.off];closeSheet();render();banner("Paused. Switch it back on any time.");return}
 if(d.add){closeSheet();banner("Sent. We'll reply within two working days.");return}
 if(b.hasAttribute("data-req")){openSheet('<h2>Request a feature</h2><p class="q">Tell us what you\'d like your portal to do. We reply with how it would work and a price before anything is built.</p><div class="field"><input data-f="wish" placeholder="For example, a sheet that tracks our edit suites" value="'+esc(S.d.wish||"")+'" autocomplete="off"></div><div style="display:flex;gap:10px"><button class="btn solid wide" data-sent>Send request</button><button class="btn" data-close>Close</button></div>');return}
 if(b.hasAttribute("data-sent")){closeSheet();banner("Sent. You'll get a quote by email (sample).");return}
 if(b.hasAttribute("data-rules")){go(FLOW.findIndex(function(f){return f.id==="rules"}));return}
 if(b.hasAttribute("data-buildopen")){openSheet(builder());return}
 if(d.bl!=null){S.bl[d.bl]=S.bl[d.bl]===0?1:0;openSheet(builder());return}
 if(b.hasAttribute("data-build")){var n=buildList().filter(function(_,i){return S.bl[i]!==0}).length;closeSheet();banner(n+" sheets built in your Drive (sample)");save();return}
 if(b.hasAttribute("data-ask")){banner("Sample: this opens a message to us.");return}
});
app.addEventListener("input",function(e){var t=e.target;
 if(t.dataset.f){S.d[t.dataset.f]=t.value;save()}
 if(t.hasAttribute("data-tone")){S.d.tone=+t.value;$("toneq").textContent=toneLine(S.d.tone);save()}
 if(t.hasAttribute("data-tnow")){S.os.now=+t.value;$("osout").innerHTML=osOut();save()}
});
app.addEventListener("change",function(e){var t=e.target;
 if(t.hasAttribute("data-drop")&&t.files&&t.files[0]){banner("Filed against "+(isSolo()?"Commercial, 28 Oct":"J-124")+" (sample): "+t.files[0].name);t.value=""}
});
document.querySelector(".side").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 if(b.dataset.view){S.view=b.dataset.view;render();return}
 if(b.dataset.sky){S.sky=b.dataset.sky;render();return}
 if(b.dataset.j!=null)go(+b.dataset.j);
 if(b.dataset.jt)home(b.dataset.jt);
 if(b.hasAttribute("data-reset")){try{localStorage.removeItem("eltio-systems-app-3")}catch(x){}location.reload()}
});
var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(render,120)});
render();
})();
</script>
