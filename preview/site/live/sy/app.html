<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Eltio Systems</title>

<style>
/* Eltio Systems client app. Same rules as Charlie's onboarding: one Geist Mono size, Inter Tight only for the question,
   sentence case, soft rounded rows, one colour per part. Content lives in the objects at the top of the script. */
:root{--ink:#0B0B0A;--white:#fff;--chrome:#F3F3F0;--chrome-fg:#0B0B0A;--grey:#8A8A83;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;--disp:"Inter Tight",-apple-system,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--chrome:#1a1a18;--chrome-fg:#F3F3F0}}
:root[data-theme="dark"]{--chrome:#1a1a18;--chrome-fg:#F3F3F0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--chrome);color:var(--chrome-fg)}
body{font:400 13px/1.45 var(--mono);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
p{margin:0}
.wrap{display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:28px 16px}
.side{width:260px;display:grid;gap:14px;padding-top:8px}
.side .q{color:var(--grey)}
.side .jump{display:grid;gap:4px}
.side .jump button{background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;color:var(--grey)}
.side .jump button.on{color:var(--chrome-fg)}
.side .jump button:hover{color:var(--chrome-fg)}
/* app frame */
.app{--bg:#fff;--fg:#0B0B0A;--q:rgba(11,11,10,.5);--hr:rgba(11,11,10,.09);--fill:#F5F5F3;--c:#DCE8D6;--d:#4F7348;
  position:relative;width:390px;height:min(820px,calc(100vh - 56px));min-height:640px;background:var(--bg);color:var(--fg);border-radius:32px;border:1px solid rgba(128,128,128,.28);overflow:hidden;display:flex;flex-direction:column}
.app[data-p="you"]{--c:#DCE8D6;--d:#4F7348}
.app[data-p="work"]{--c:#F4E7B8;--d:#85691A}
.app[data-p="services"]{--c:#D6E4F1;--d:#3C6286}
.app[data-p="accounts"]{--c:#F3D8CE;--d:#96503F}
.app[data-p="rules"]{--c:#E4DDF0;--d:#5E4B86}
.app[data-p="start"]{--c:#E6E3DC;--d:#5C574C}
@media (max-width:720px){.wrap{padding:0;display:block}.side{display:none}.app{width:100%;height:100vh;height:100dvh;min-height:0;border-radius:0;border:0}}
.scr{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 20px 20px;display:flex;flex-direction:column;gap:18px}
.q{color:var(--q)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:28px}
.lnk{background:none;border:0;padding:0;cursor:pointer;color:var(--q)}
.lnk:hover{color:var(--fg)}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:4px;border-radius:4px;background:var(--hr);transition:background .4s}
.segs i.on{background:var(--d)}
h1{font:500 30px/1.08 var(--disp);letter-spacing:-.02em;margin:0}
h2{font:500 24px/1.12 var(--disp);letter-spacing:-.015em;margin:0}
.part{display:flex;align-items:center;gap:8px;color:var(--q)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);flex:none}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--hr);background:var(--bg);padding:8px 13px;border-radius:999px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--c);border-color:var(--c)}
.rows{display:grid;gap:6px}
.row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:13px 14px;border:0;border-radius:12px;background:var(--fill);text-align:left;cursor:pointer;transition:background .25s}
.row[aria-pressed="true"]{background:var(--c)}
.row .sub{grid-column:1/-1;color:var(--q)}
.row[aria-pressed="true"] .sub{color:rgba(11,11,10,.62)}
.row.soon{cursor:default;opacity:.55}
.tog{width:34px;height:20px;border-radius:999px;background:var(--hr);position:relative;transition:background .25s;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .25s}
[aria-pressed="true"] .tog,.tog.on{background:var(--d)}
[aria-pressed="true"] .tog::after,.tog.on::after{transform:translateX(14px)}
.tog.lock{opacity:.6}
.field{display:grid;gap:6px}
.field input{border:0;border-radius:12px;background:var(--fill);padding:13px 14px;outline:none;width:100%}
.field input:focus{box-shadow:0 0 0 1.5px var(--d)}
.foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--hr);background:var(--bg)}
.btn{border:1px solid var(--hr);background:var(--bg);padding:12px 20px;border-radius:999px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.wide{flex:1;text-align:center}
.sum{display:grid;gap:0;border-radius:12px;background:var(--fill);overflow:hidden}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--hr)}
.sum div:last-child{border-bottom:0}
.note{padding:12px 14px;border:1px dashed var(--hr);border-radius:12px;color:var(--q)}
.slider{display:grid;gap:8px}
.slider .ends{display:flex;justify-content:space-between;color:var(--q)}
input[type=range]{width:100%;accent-color:var(--d)}
.quote{padding:12px 14px;border-radius:12px;background:var(--c);white-space:pre-wrap}
/* home */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--hr);padding:6px 6px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.tabs button{background:none;border:0;padding:8px 0;cursor:pointer;color:var(--q);display:grid;justify-items:center;gap:5px}
.tabs button.on{color:var(--fg)}
.tabs button i{width:6px;height:6px;border-radius:50%;background:transparent}
.tabs button.on i{background:var(--fg)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kpi{background:var(--fill);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.kpi b{font:500 20px/1.15 var(--disp);letter-spacing:-.01em}
.status{color:var(--q);white-space:nowrap}
.status.live{color:var(--fg)}
.status.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#4F7348;margin-right:6px;vertical-align:1px}
.sheet{position:absolute;inset:auto 0 0 0;background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.14);padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:82%;overflow-y:auto;z-index:20}
.sheet.on{transform:none}
.grab{width:36px;height:4px;border-radius:4px;background:var(--hr);justify-self:center}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .3s;z-index:19}
.shade.on{opacity:1;pointer-events:auto}
.banner{position:absolute;left:12px;right:12px;top:12px;z-index:30;background:var(--fg);color:var(--bg);padding:11px 14px;border-radius:12px;transform:translateY(calc(-100% - 24px));visibility:hidden;transition:transform .3s,visibility .3s}
.banner.on{transform:none;visibility:visible}
:focus-visible{outline:2px solid #3C6286;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* view switch + desktop portal */
.viewbar{display:flex;gap:4px;padding:3px;background:rgba(128,128,128,.12);border-radius:999px;width:max-content}
.viewbar button{background:none;border:0;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--grey)}
.viewbar button.on{background:var(--chrome-fg);color:var(--chrome)}
.app.desk{width:min(1120px,calc(100vw - 360px));border-radius:18px}
.app.desk.flow .scr{padding:36px max(24px,calc(50% - 320px)) 24px}
.app.desk.flow .foot{padding-left:max(24px,calc(50% - 320px));padding-right:max(24px,calc(50% - 320px))}
.app.desk:not(.flow) .scr{padding:0}
.dk{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100%}
.dnav{border-right:1px solid var(--hr);padding:22px 14px;display:grid;gap:2px;align-content:start;position:sticky;top:0;height:max-content}
.dnav .who{padding:0 10px 16px;display:grid;gap:2px}
.dnav button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--q);display:flex;justify-content:space-between}
.dnav button.on{background:var(--fill);color:var(--fg)}
.dnav button:hover{color:var(--fg)}
.dmain{padding:24px 28px 40px;display:flex;flex-direction:column;gap:18px;min-width:0}
.two{display:grid;gap:18px}
.grp{display:grid;gap:12px;align-content:start}
.two>div{display:grid;gap:12px;align-content:start}
.app.desk .two{grid-template-columns:1fr 1fr}
.app.desk .kpis{grid-template-columns:repeat(4,1fr)}
.app.desk .svcgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.app.desk .svcgrid>div{display:grid;gap:12px;align-content:start}
.big{font:500 34px/1.05 var(--disp);letter-spacing:-.02em}
.clock{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.clock div{background:var(--fill);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.clock b{font:500 20px/1.15 var(--disp)}
.warn{padding:11px 14px;border-radius:12px;background:#F4E7B8}
.drop{display:grid;gap:6px;justify-items:center;text-align:center;padding:22px 14px;border:1px dashed var(--hr);border-radius:12px;color:var(--q);cursor:pointer}
.drop input{display:none}
.ckl{border-radius:12px;background:var(--fill);overflow:hidden}
.chk{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 14px;border-bottom:1px solid var(--hr)}
.chk:last-child{border-bottom:0}
.chk i{width:14px;height:14px;border-radius:50%;border:1px solid var(--hr);margin-top:2px}
.chk.ok i{background:#4F7348;border-color:#4F7348}
.chk.wait i{background:#F4E7B8;border-color:#D9C27A}
.new{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--fill);color:var(--q);margin-left:6px;vertical-align:1px}
</style>
</head>

    <div class="scr" id="scr"></div>

</div>

  '<div class="two"><div><div class="part"><span class="dot" style="background:#F3D8CE"></span>Connected</div><div class="rows">'+ACCOUNTS.map(function(a){var on=a[3]||S.d.acc[a[0]];return '<div class="row" style="cursor:default"><span>'+a[1]+'</span><span class="status'+(on?' live':'')+'">'+(on?'Connected':'Not used')+'</span><span class="sub">'+a[2]+'</span></div>'}).join("")+'</div></div>'+
  '<div><div class="part"><span class="dot" style="background:#E4DDF0"></span>Care</div><div class="sum"><div><span>Plan</span><span>'+CARE[S.d.size||"micro"]+' a month</span></div><div><span>Renews</span><span>1 Nov, monthly</span></div><div><span>Replies</span><span>Within two working days</span></div><div><span>Our access</span><span>Ends 7 days after care</span></div></div><div class="rows"><button class="row" data-ask><span>Runbook and data map</span><span class="q">›</span><span class="sub">What connects to what, and how to switch each part off.</span></button><button class="row" data-ask><span>Pause or end care</span><span class="q">›</span><span class="sub">Everything stays on your accounts.</span></button></div></div></div>'}
};

/* ---------- render ---------- */
var app=$("app");
function isDesk(){return S.view==="desk"&&window.innerWidth>=1000}
function render(){
 WAITING=isSolo()?WAITING_F:WAITING_C;
 var desk=isDesk();app.classList.toggle("desk",desk);app.classList.toggle("flow",S.mode==="flow");
 if(S.mode==="flow"){var st=FLOW[S.i],r=V[st.id]();app.dataset.p=st.p;$("scr").innerHTML=head(st)+r.b;$("bottom").innerHTML='<div class="foot">'+r.f+'</div>'}
 else{app.dataset.p="you";var body=H[S.tab]();
  if(desk){$("scr").innerHTML='<div class="dk"><nav class="dnav"><div class="who"><span>'+esc(S.d.name||(isSolo()?"Your business":"Your company"))+'</span><span class="q">Eltio Systems</span></div>'+HOME.map(function(t){var c=t==="waiting"?waitCount():0;return '<button class="'+(S.tab===t?'on':'')+'" data-tab="'+t+'"><span>'+HOME_NAMES[t]+'</span><span class="q">'+(c||'')+'</span></button>'}).join("")+'</nav><div class="dmain">'+body+'</div></div>';$("bottom").innerHTML=''}
  else{$("scr").innerHTML=body;var cur=MOBILE.indexOf(S.tab)>=0?S.tab:"more";$("bottom").innerHTML='<div class="tabs">'+MOBILE.map(function(t){return '<button class="'+(cur===t?'on':'')+'" data-'+(t==="more"?'more':'tab="'+t+'"')+'><i></i>'+(t==="more"?"More":HOME_NAMES[t])+'</button>'}).join("")+'</div>'}}
 $("jump").innerHTML='<span class="q">Onboarding</span>'+FLOW.map(function(f,k){return '<button data-j="'+k+'" class="'+(S.mode==="flow"&&S.i===k?'on':'')+'">'+String(k+1).padStart(2,"0")+'  '+f.id.charAt(0).toUpperCase()+f.id.slice(1)+'</button>'}).join("")+'<span class="q" style="padding-top:8px">The portal</span>'+HOME.map(function(t){return '<button data-jt="'+t+'" class="'+(S.mode==="home"&&S.tab===t?'on':'')+'">'+HOME_NAMES[t]+'</button>'}).join("")+'<button data-reset style="padding-top:10px">Start again</button>';
 [].forEach.call(document.querySelectorAll("#viewbar button"),function(b){b.classList.toggle("on",b.dataset.view===(isDesk()?"desk":"phone"))});
 save();
}
function go(i){S.mode="flow";S.i=Math.max(0,Math.min(FLOW.length-1,i));closeSheet();render();$("scr").scrollTop=0}
function home(t){S.mode="home";S.tab=t||"home";
 if(S.d&&S.d.svc){S.on={};SERVICES.forEach(function(s){if(S.d.svc[s.id]&&fits(s))S.on[s.id]=1});if(!Object.keys(S.on).length)S.on={chase:1,brief:1}}
 closeSheet();render();$("scr").scrollTop=0}
var bt;function banner(t){var b=$("banner");b.textContent=t;b.classList.add("on");clearTimeout(bt);bt=setTimeout(function(){b.classList.remove("on")},2200)}
function openSheet(h){$("sheet").innerHTML='<span class="grab"></span>'+h;$("sheet").classList.add("on");$("shade").classList.add("on")}
function closeSheet(){$("sheet").classList.remove("on");$("shade").classList.remove("on")}

app.addEventListener("click",function(e){
 var b=e.target.closest("button,.shade");if(!b)return;
 if(b.id==="shade"||b.hasAttribute("data-close")){closeSheet();return}
 if(b.hasAttribute("data-next")){go(S.i+1);return}
 if(b.hasAttribute("data-back")){go(S.i-1);return}
 if(b.hasAttribute("data-home")){home("home");return}
 if(b.hasAttribute("data-more")){openSheet('<h2>More</h2><div class="rows">'+["services","files","account"].map(function(t){return '<button class="row" data-tab="'+t+'"><span>'+HOME_NAMES[t]+'</span><span class="q">›</span></button>'}).join("")+'</div>');return}
 if(b.hasAttribute("data-lunch")){S.os.lunch=S.os.now;render();banner("Lunch called at "+tm(S.os.lunch)+". Crew see it now.");return}
 if(b.hasAttribute("data-unlunch")){S.os.lunch=null;render();return}
 if(b.hasAttribute("data-wrap")){S.os.wrap=S.os.now;render();banner("Wrap called at "+tm(S.os.wrap)+". Crew invoices will be checked against it.");return}
 if(b.hasAttribute("data-unwrap")){S.os.wrap=null;render();return}
 if(b.hasAttribute("data-crewview")){S.os.crew=S.os.crew?0:1;render();return}
 var d=b.dataset;
 if(d.pill){var k=d.pill;if(d.m==="1"){S.d[k][d.v]=!S.d[k][d.v]}else{S.d[k]=S.d[k]===d.v?"":d.v}
   if(k==="pain"){var map={"Chasing agencies and labels":"chase","Getting paid on time":"chase","Holds and pencils":"holds","Holds that never confirm":"holds","Cancellations":"confirm","Crew paperwork and tax status":"start","Crew invoices and overtime":"overtime","Permits and licences":"permits","Receipts and floats":"receipts","Receipts and mileage":"receipts","Tax and VAT":"tax","Knowing where the money is":"brief","Cost reports and wrap actuals":"cost","VAT and PAYE dates":"cal","Rights and deliverables":"deliver","Books behind":"books"};S.d.svc={};Object.keys(S.d.pain).forEach(function(p){if(S.d.pain[p]&&map[p])S.d.svc[map[p]]=1});if(!Object.keys(S.d.svc).length)S.d.svc={chase:1,brief:1}}
   render();return}
 if(d.size){S.d.size=d.size;S.d.svc={chase:1,brief:1};if(d.size==="solo"){S.d.svc.holds=1;S.d.svc.tax=1}render();return}
 if(d.svc){S.d.svc[d.svc]=!S.d.svc[d.svc];render();return}
 if(d.acc){S.d.acc[d.acc]=!S.d.acc[d.acc];render();return}
 if(d.start){S.d.start=d.start;render();return}
 if(d.tab){closeSheet();S.tab=d.tab;render();$("scr").scrollTop=0;return}
 if(d.job!=null){var j=jobs()[+d.job];openSheet('<h2>'+esc(j.n)+'</h2><p class="q">'+esc(j.c)+' · '+esc(j.st)+' · '+esc(j.when)+'</p><div class="ckl">'+j.ck.map(function(c){return '<div class="chk '+(c[2]===1?'ok':c[2]===2?'wait':'')+'"><i></i><span>'+esc(c[0])+'<br><span class="q">'+esc(c[1])+'</span></span><span class="q">'+(c[2]===1?'Done':c[2]===2?'Waiting':'Later')+'</span></div>'}).join("")+'</div><div style="display:flex;gap:10px"><button class="btn solid wide" data-open="sheet">Open the job sheet</button><button class="btn" data-close>Close</button></div>');return}
 if(d.open){closeSheet();banner(d.open==="tpl"?"Sample: opens your template, filled in.":"Sample: opens the sheet in your Google Drive.");return}
 if(d.wait!=null){var x=WAITING[+d.wait];openSheet('<h2>'+esc(x.t)+'</h2><p class="q">'+esc(x.s)+'</p>'+(x.draft?'<p class="quote">'+esc(x.draft)+'</p>':'')+'<div style="display:flex;gap:10px">'+(x.k==="chase"||x.k==="holds"?'<button class="btn solid wide" data-did="'+d.wait+'">Open in your inbox</button>':x.k==="permits"?'<button class="btn solid wide" data-did="'+d.wait+'">Open the form</button>':'<button class="btn solid wide" data-did="'+d.wait+'">Mark as done</button>')+'<button class="btn" data-close>Later</button></div>'+(x.k==="chase"?'<p class="q">You send it from your own email. We just wrote it.</p>':''));return}
 if(d.did!=null){S.done[d.did]=1;closeSheet();render();banner(WAITING[+d.did].k==="chase"||WAITING[+d.did].k==="holds"?"Draft opened in your inbox (sample)":WAITING[+d.did].k==="permits"?"Form opened, pre-filled (sample)":"Done");return}
 if(d.sv){var s=SERVICES.filter(function(z){return z.id===d.sv})[0],on=!!S.on[s.id];
   openSheet('<h2>'+esc(s.name)+'</h2><p class="q">'+esc(s.line)+'</p><div class="sum"><div><span class="q">Status</span><span>'+(on?'On':'Not set up')+'</span></div><div><span class="q">Runs</span><span>'+esc(s.runs)+'</span></div>'+(on?'<div><span class="q">Last run</span><span>Today, all fine</span></div>':'<div><span class="q">Setup from</span><span>'+esc(s.from)+'</span></div>')+'</div><div style="display:flex;gap:10px">'+(on?'<button class="btn wide" data-off="'+s.id+'">Pause this</button>':'<button class="btn solid wide" data-add="'+s.id+'">Ask us to add it</button>')+'<button class="btn" data-close>Close</button></div>');return}
 if(d.off){delete S.on[d.off];closeSheet();render();banner("Paused. Switch it back on any time.");return}
 if(d.add){closeSheet();banner("Sent. We'll reply within two working days.");return}
 if(b.hasAttribute("data-ask")){banner("Sample: this opens a message to us.");return}
});
app.addEventListener("input",function(e){var t=e.target;
 if(t.dataset.f){S.d[t.dataset.f]=t.value;save()}
 if(t.hasAttribute("data-tone")){S.d.tone=+t.value;$("toneq").textContent=toneLine(S.d.tone);save()}
 if(t.hasAttribute("data-tnow")){S.os.now=+t.value;$("osout").innerHTML=osOut();save()}
});
app.addEventListener("change",function(e){var t=e.target;
 if(t.hasAttribute("data-drop")&&t.files&&t.files[0]){banner("Filed against "+(isSolo()?"Commercial, 28 Oct":"J-124")+" (sample): "+t.files[0].name);t.value=""}
});
document.querySelector(".side").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 if(b.dataset.view){S.view=b.dataset.view;render();return}
 if(b.dataset.j!=null)go(+b.dataset.j);
 if(b.dataset.jt)home(b.dataset.jt);
 if(b.hasAttribute("data-reset")){try{localStorage.removeItem("eltio-systems-app-3")}catch(x){}location.reload()}
});
var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(render,120)});
render();
})();
</script>
