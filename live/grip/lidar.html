<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grip LiDAR scan</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #0D0E0D; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .m { position: fixed; font: 400 11px/1.3 "DM Mono", ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase; color: rgba(243,243,240,.55); }
  .tl { left: 18px; top: 16px; } .tr { right: 18px; top: 16px; text-align: right; } .bl { left: 18px; bottom: 16px; } .br { right: 18px; bottom: 16px; text-align: right; }
  .m b { font-weight: 400; color: #F3F3F0; }
</style>
</head>
<body>
<canvas id="c" aria-label="A phone's LiDAR sweeps up a 40 degree board, building the wall and its holds as points"></canvas>
<div class="m tl">LiDAR / board 40°</div>
<div class="m tr"><b id="pts">0</b> points</div>
<div class="m bl">Wall <b>3.2 × 4.0 m</b></div>
<div class="m br">Holds <b id="hs">0</b></div>
<script>
(function () {
  var cv = document.getElementById('c'), x = cv.getContext('2d'), W, H, DPR;
  var BLUE = '74,116,255', WHITE = '243,243,240';
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; x.setTransform(DPR, 0, 0, DPR, 0, 0); }
  addEventListener('resize', size); size();
  function rnd(a) { var s = Math.sin(a * 91.17) * 43758.5453; return s - Math.floor(s); }
  // a 3.2 x 4.0 m board, overhanging 40 degrees toward the camera
  var A = 40 * Math.PI / 180, holds = [], pts = [];
  for (var i = 0; i < 18; i++) holds.push({ u: -1.4 + rnd(i + 1) * 2.8, v: .35 + rnd(i + 40) * 3.4, r: .07 + rnd(i + 80) * .09, k: 5 + Math.floor(rnd(i + 7) * 3) });
  holds.sort(function (a, b) { return a.v - b.v; });
  for (var u = -1.6; u <= 1.6001; u += .075) for (var v = 0; v <= 4.0001; v += .075) {
    var ju = u + (rnd(u * 13 + v * 7) - .5) * .03, jv = v + (rnd(u * 5 + v * 17) - .5) * .03, lift = 0, h = -1;
    holds.forEach(function (hd, k) { var d = Math.hypot(ju - hd.u, jv - hd.v); if (d < hd.r) { lift = Math.max(lift, (1 - d / hd.r) * .06); h = k; } });
    pts.push([ju, jv, lift, h]);
  }
  // project, then fit the whole board into the frame with a margin
  function R(u, v, lift) { var X = u, Y = v * Math.cos(A), Z = -v * Math.sin(A) - lift, fz = Z + 8.5; return [X / fz, -(Y - 1.6) / fz]; }
  var bx0, bx1, by0, by1;
  [[-1.6, 0], [1.6, 0], [1.6, 4], [-1.6, 4]].forEach(function (q) { var r = R(q[0], q[1], 0); bx0 = Math.min(bx0 === undefined ? 1e9 : bx0, r[0]); bx1 = Math.max(bx1 === undefined ? -1e9 : bx1, r[0]); by0 = Math.min(by0 === undefined ? 1e9 : by0, r[1]); by1 = Math.max(by1 === undefined ? -1e9 : by1, r[1]); });
  function P(u, v, lift) {
    var r = R(u, v, lift), sc = Math.min((W * .7) / (bx1 - bx0), (H * .74) / (by1 - by0));
    return [W / 2 + (r[0] - (bx0 + bx1) / 2) * sc, H * .48 + (r[1] - (by0 + by1) / 2) * sc];
  }
  var t0 = performance.now();
  function frame(now) {
    var t = reduce ? 4.4 : (now - t0) / 1000, cyc = t % 6.5, sv = Math.min(4.05, cyc / 4.4 * 4.05);
    x.clearRect(0, 0, W, H);
    // the board's outline
    x.strokeStyle = 'rgba(' + WHITE + ',.14)'; x.lineWidth = 1; x.beginPath();
    [[-1.6, 0], [1.6, 0], [1.6, 4], [-1.6, 4], [-1.6, 0]].forEach(function (q, k) { var p = P(q[0], q[1], 0); k ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]); }); x.stroke();
    // the phone on the mat, and its sweep
    var ph = [W / 2, H - 34], lp = P(-1.6, sv, 0), rp = P(1.6, sv, 0);
    x.strokeStyle = 'rgba(' + WHITE + ',.08)'; x.beginPath(); x.moveTo(ph[0], ph[1]); x.lineTo(lp[0], lp[1]); x.moveTo(ph[0], ph[1]); x.lineTo(rp[0], rp[1]); x.stroke();
    x.strokeStyle = 'rgba(' + WHITE + ',.7)'; x.beginPath(); x.moveTo(lp[0], lp[1]); x.lineTo(rp[0], rp[1]); x.stroke();
    x.strokeStyle = 'rgba(' + WHITE + ',.5)'; x.strokeRect(ph[0] - 7, ph[1] - 12, 14, 24);
    var n = 0;
    for (var k = 0; k < pts.length; k++) {
      var q = pts[k]; if (q[1] > sv) continue; n++;
      var p = P(q[0], q[1], q[2]), near = sv - q[1] < .12;
      x.fillStyle = q[3] >= 0 ? 'rgba(' + WHITE + ',' + (near ? .95 : .7) + ')' : 'rgba(' + BLUE + ',' + (near ? 1 : .7) + ')';
      var r = q[3] >= 0 ? 1.8 : 1.5; x.fillRect(p[0] - r / 2, p[1] - r / 2, r, r);
    }
    // holds the sweep has passed are traced as outlines
    var hs = 0;
    holds.forEach(function (hd, j) {
      if (hd.v + hd.r > sv) return; hs++;
      x.strokeStyle = 'rgba(' + WHITE + ',.55)'; x.beginPath();
      for (var s = 0; s <= hd.k; s++) { var an = s / hd.k * Math.PI * 2 + j, rr = hd.r * (1.05 + .25 * rnd(j * 9 + s % hd.k)), p = P(hd.u + Math.cos(an) * rr, hd.v + Math.sin(an) * rr, .02); s ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]); }
      x.stroke();
    });
    document.getElementById('pts').textContent = n.toLocaleString('en-GB');
    document.getElementById('hs').textContent = hs;
    if (!reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
