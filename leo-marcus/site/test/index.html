<script>
/* stands in for Cargo: a site id, and the API answers built from the round 2 films */
window.HS_TEST = 1;
window.__PRELOADED_STATE__ = { site: { id: 1 } };
var _f = window.fetch;
window.fetch = function (u, o) {
  var m = String(u).match(/cargo\.site\/_api\/v1-p\/pages\/1\/(.*)$/);
  if (!m) return _f(u, o);
  var r = /^scaffolding/.test(m[1]) ? HS_FIXTURES.scaffolding : /^filter/.test(m[1]) ? HS_FIXTURES.pages : /^url\/info/.test(m[1]) ? HS_FIXTURES.info : null;
  return Promise.resolve(new Response(JSON.stringify(r), { status: r ? 200 : 404 }));
};
</script>
</head>
<body>
<div class="cargo-page">Cargo's own page (hidden once the site draws)</div>

</body>
