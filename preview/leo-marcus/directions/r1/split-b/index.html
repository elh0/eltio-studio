<!doctype html>
<html lang="en" data-way="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Helical Sound: Split, round 1 (B, footer as header)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Geist+Mono:wght@400&display=swap">
<link rel="stylesheet" href="../../shared.css">
<style>
/* Split, round 1 (B, footer as header). Leo's notes: a third size for project names (set in a mono),
   no separate header (pinned at the top), "Helical Sound" bold as home, the credit small in a corner,
   and director / agency only when filled in. */
:root { --nbig: clamp(38px, 5.6vw, 88px); --mid: clamp(14px, 1.25vw, 17px); --small: 12px; --sans: "Inter Tight", "Helvetica Neue", Arial, sans-serif; --line: color-mix(in srgb, var(--fg) 16%, transparent); --top: 0px; --bot: 0px; }
@media (min-width: 900px) { :root { --small: 13px; } }
body { font: 400 var(--small)/1.3 var(--sans); }
.q2 { opacity: .45; }
.pm { font: 400 var(--mid)/1.15 var(--mono); letter-spacing: -.01em; }
a:hover { opacity: .5; }
.scroll { position: fixed; left: 0; right: 0; top: var(--top); bottom: var(--bot); overflow-y: auto; padding: 0 max(var(--pad), env(safe-area-inset-right, 0px)) 0 max(var(--pad), env(safe-area-inset-left, 0px)); }
.grid { display: grid; grid-template-columns: 1fr; column-gap: 4vw; }
@media (min-width: 900px) { .grid { grid-template-columns: 1.1fr .9fr; } }
.tg { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: calc(env(safe-area-inset-top, 0px) * var(--safe, 0) + 16px) 0 10px; }
.tg button { opacity: .4; transition: opacity .2s; }
.tg button[aria-pressed="true"], .tg button:hover { opacity: 1; }
.names { display: grid; justify-items: start; padding-bottom: 90px; }
.names button { text-align: left; padding: .06em 0 .1em; display: grid; transition: opacity .3s; }
.names .c { font: 500 var(--nbig)/1 var(--sans); letter-spacing: -.035em; }
.names .pm { opacity: .5; padding: 2px 0 6px .08em; }
.names:hover button:not(:hover):not([aria-current="true"]), .names.has button:not([aria-current="true"]):not(:hover) { opacity: .3; }

.pane { display: none; }
@media (min-width: 900px) { .pane { display: block; } .pane .in { position: sticky; top: 16px; padding-top: 16px; } }
.in { display: grid; gap: 10px; }
.in .ttl { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.in .film { aspect-ratio: 2.42; cursor: pointer; }
.cr { display: grid; grid-template-columns: auto 1fr; gap: 3px 18px; margin: 4px 0 0; }
.cr dt { opacity: .45; } .cr dd { margin: 0; }
.bar { height: 1px; background: var(--line); position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--fg); }
.ctl { display: flex; justify-content: space-between; }
.empty { opacity: .45; }

/* phone: the player slides up */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg); border-top: 1px solid var(--fg); padding: 14px max(var(--pad), env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(var(--pad), env(safe-area-inset-left, 0px)); transform: translateY(105%); transition: transform .7s var(--ease), background .5s var(--ease); }
.sheet.open { transform: none; }
@media (min-width: 900px) { .sheet { display: none; } }

/* the info bar (pal.tv): pinned, here as pinned at the top */
.bar2 { position: fixed; left: 0; right: 0; z-index: 20; background: var(--bg); display: grid; grid-template-columns: 1fr auto; gap: 6px 18px; padding: 12px max(var(--pad), env(safe-area-inset-right, 0px)) 12px max(var(--pad), env(safe-area-inset-left, 0px)); transition: background .5s var(--ease); }
.bar2 .nm { font: 500 var(--mid)/1.1 var(--sans); letter-spacing: -.01em; }
.bar2 .bio, .bar2 .c2 { display: none; }
.bar2 .ct { display: flex; gap: 14px; grid-column: 1 / -1; order: 3; }
.ways { position: static; transform: none; align-self: center; }
@media (min-width: 900px) {
  .bar2 .ct { grid-column: auto; order: 0; }
  .bar2 { grid-template-columns: 1.1fr 1.2fr .6fr auto; gap: 0; padding-top: 0; padding-bottom: 0; }
  .bar2 > * { padding: 14px 16px 16px; }
  .bar2 > :first-child { padding-left: 0; }
  .bar2 > * + * { border-left: 1px solid var(--fg); }
  .bar2 .bio { display: block; margin: 0; max-width: 46ch; }
  .bar2 .ct { display: block; } .bar2 .ct > * { display: block; } .bar2 .ct .em { display: block; }
  .bar2 .ways { padding-right: 0; align-self: start; }
}
.credit { position: fixed; z-index: 21; font-size: 11px; opacity: .45; padding: 0 max(var(--pad), env(safe-area-inset-right, 0px)); }
.credit:hover { opacity: .8; }
/* B: the same info bar used as a header; the credit sits in the bottom corner. */
.bar2 { top: 0; border-bottom: 1px solid var(--fg); padding-top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (min-width: 900px) { .bar2 { padding-top: env(safe-area-inset-top, 0px); } }
.credit { bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); right: 0; }
/* refine (28 Oct): looser tracking, clearer steps between the three sizes, more room */
:root { --nbig: clamp(36px, 5.1vw, 80px); --mid: clamp(13px, 1.05vw, 15px); }
.tg { gap: 6px 18px; padding: calc(env(safe-area-inset-top, 0px) * var(--safe, 0) + 26px) 0 26px; }
.names { gap: clamp(16px, 1.8vw, 26px); padding-bottom: 120px; }
.names button { padding: 0; gap: 7px; }
.names .c { letter-spacing: -.022em; line-height: .98; }
.names .pm { padding: 0 0 0 .08em; letter-spacing: -.02em; }
@media (min-width: 900px) { .pane .in { top: 26px; padding-top: 26px; } }
.in { gap: 14px; }
.in .ttl { font: 500 clamp(18px, 1.5vw, 22px)/1.1 var(--sans); letter-spacing: -.015em; }
.in .ttl button { font: 400 var(--small)/1.3 var(--sans); letter-spacing: 0; }
.in > .pm { margin-top: -8px; opacity: .55; }
.in .film { margin-top: 6px; }
.cr { gap: 6px 22px; margin-top: 10px; line-height: 1.4; }
.bar2 { padding-top: 16px; padding-bottom: 16px; row-gap: 10px; }
.bar2 .bio { line-height: 1.45; }
@media (min-width: 900px) { .bar2 { padding-top: 0; padding-bottom: 0; } .bar2 > * { padding: 18px 22px 20px; } .bar2 .ct > * + * { margin-top: 2px; } }
</style>
</head>
<body class="vb">
<header class="bar2" id="bar2">
  <a href="#" class="nm" id="home">Helical Sound</a>
  <p class="bio">A London-based music and sound studio creating bespoke music and sound design for fashion and advertising.</p>
  <div class="ct"><span class="c2 q2">Contact</span><a class="em" href="mailto:hello@helical-sound.com">hello@helical-sound.com</a><a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a></div>
  <div class="ways" aria-label="Colourway">
    <button type="button" data-way-btn="ink" aria-label="Off-white and black"></button>
    <button type="button" data-way-btn="red" aria-label="Off-white and red"></button>
    <button type="button" data-way-btn="dark" aria-label="Black and off-white"></button>
  </div>
</header>

<div class="scroll" id="scroll">
  <div class="grid">
    <div>
      <nav class="tg" id="tg" aria-label="Filter by work"></nav>
      <div class="names" id="names"></div>
    </div>
    <aside class="pane" aria-label="Now playing"><div class="in" id="pane"></div></aside>
  </div>
</div>
<a class="credit" href="https://eltio.studio" target="_blank" rel="noopener">Site by Eltio Studio</a>

<section class="sheet" id="sheet" aria-label="Now playing"><div class="in" id="sheetIn"></div></section>

<script src="../../shared.js"></script>
<script src="../work-r1.js"></script>
<script>
var tag = 'all', list = WORK.slice(), w = null, playing = false, t0 = 0, pos = 0;
var phone = function () { return innerWidth < 900; };
function build() {
  document.getElementById('tg').innerHTML = ['all'].concat(TAG_ORDER).map(function (k) {
    return '<button type="button" data-tag="' + k + '" aria-pressed="' + (k === tag) + '">' + (k === 'all' ? 'All' : TAGS[k]) + ' ' + count(k) + '</button>';
  }).join('');
  list = tag === 'all' ? WORK.slice() : WORK.filter(function (x) { return x.t.indexOf(tag) > -1; });
  document.getElementById('names').innerHTML = list.map(function (x, i) {
    return '<button type="button" data-i="' + i + '" aria-current="' + (x === w) + '"><span class="c">' + x.c + '</span><span class="pm">' + x.p + '</span></button>';
  }).join('');
  document.getElementById('names').classList.toggle('has', !!w && list.indexOf(w) > -1);
}
/* only the credits that exist: no empty Director or Agency lines */
function creds(x) {
  var h = '';
  if (x.dir) h += '<dt>Director</dt><dd>' + x.dir + '</dd>';
  if (x.ag) h += '<dt>Agency</dt><dd>' + x.ag + '</dd>';
  return h + '<dt>Helical Sound</dt><dd>' + credits(x) + '</dd>';
}
function panel() {
  if (!w) return '<p class="empty" style="margin:0">Choose a client to play the film.</p>';
  return '<div class="ttl"><span><b style="font-weight:500">' + w.c + '</b></span>' + (phone() ? '<button type="button" data-k="close">Close</button>' : '') + '</div>' +
    '<div class="pm">' + w.p + '</div>' +
    '<div class="film"><img alt="" src="' + still(w) + '"></div><div class="bar"><i></i></div>' +
    '<div class="ctl"><button type="button" data-k="prev">Prev</button><button type="button" data-k="play">Play</button><span class="tm">00:00 / ' + w.d + '</span><button type="button" data-k="next">Next</button></div>' +
    '<dl class="cr">' + creds(w) + '</dl>';
}
function root() { return document.getElementById(phone() ? 'sheetIn' : 'pane'); }
function load(x, auto) {
  w = x; pos = 0; playing = false;
  document.getElementById('pane').innerHTML = panel(); document.getElementById('sheetIn').innerHTML = panel();
  document.getElementById('sheet').classList.toggle('open', phone());
  build(); setPlay(!!auto);
}
function setPlay(p) {
  playing = p; t0 = performance.now() - pos * 1000;
  var r = root(); if (!r.querySelector('.film')) return;
  r.querySelector('.film').classList.toggle('on', p); r.querySelector('[data-k=play]').textContent = p ? 'Pause' : 'Play';
  if (p) tick();
}
function tick() {
  if (!playing || !w) return;
  var r = root(), len = secs(w.d); pos = (performance.now() - t0) / 1000;
  if (pos >= len) { step(1); return; }
  r.querySelector('.bar i').style.width = pos / len * 100 + '%'; r.querySelector('.tm').textContent = clock(pos) + ' / ' + w.d;
  requestAnimationFrame(tick);
}
function step(d) { var i = list.indexOf(w); load(list[((i < 0 ? 0 : i + d) + list.length) % list.length], true); }
function ctl(e) {
  var k = e.target.closest('[data-k]');
  if (!k) { if (e.target.closest('.film')) setPlay(!playing); return; }
  var a = k.getAttribute('data-k');
  if (a === 'play') setPlay(!playing); if (a === 'next') step(1); if (a === 'prev') step(-1);
  if (a === 'close') { setPlay(false); document.getElementById('sheet').classList.remove('open'); }
}
document.getElementById('pane').addEventListener('click', ctl);
document.getElementById('sheetIn').addEventListener('click', ctl);
document.getElementById('names').addEventListener('click', function (e) { var b = e.target.closest('[data-i]'); if (b) load(list[+b.getAttribute('data-i')], true); });
document.getElementById('tg').addEventListener('click', function (e) { var b = e.target.closest('[data-tag]'); if (!b) return; tag = b.getAttribute('data-tag'); build(); });
document.getElementById('home').onclick = function (e) { e.preventDefault(); document.getElementById('sheet').classList.remove('open'); document.getElementById('scroll').scrollTo({ top: 0, behavior: 'smooth' }); };
function fit() { var h = document.getElementById('bar2').offsetHeight + 'px'; document.documentElement.style.setProperty('--top', h); }
addEventListener('resize', fit); document.fonts && document.fonts.ready.then(fit);
build(); fit(); if (!phone()) load(WORK[0], false); else document.getElementById('pane').innerHTML = panel();
</script>
</body>
</html>
