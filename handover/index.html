<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handover: Eltio Studio</title>
<meta name="description" content="How to look after your new site.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&family=Inter+Tight:wght@500&display=swap">
<style>
/* Client onboarding, mono direction. One size of Geist Mono, sentence case (nothing in capitals),
   soft rounded boxes, and a Scandi colour per chapter that marks progress and success. */
:root {
  --ink: #0B0B0A; --grey: #8A8A83; --white: #ffffff;
  --chrome: #F3F3F0; --chrome-fg: #0B0B0A;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --chrome: #1a1a18; --chrome-fg: #F3F3F0; } }
:root[data-theme="dark"] { --chrome: #1a1a18; --chrome-fg: #F3F3F0; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--chrome); color: var(--chrome-fg); font: 400 12px/1.4 var(--mono); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }

.bar { position: sticky; top: 0; z-index: 90; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--chrome); border-bottom: 1px solid rgba(128,128,128,.3); }
.grp { display: flex; flex-wrap: wrap; gap: 6px; }
.grp button { background: transparent; border: 1px solid var(--chrome-fg); color: var(--chrome-fg); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.grp button[aria-pressed="true"] { background: var(--chrome-fg); color: var(--chrome); }
.why { padding: 10px 16px 0; margin: 0; max-width: 86ch; color: var(--grey); min-height: 3.9em; }
.stage { padding: 10px 16px 40px; display: flex; justify-content: center; }

/* ---------- page ---------- */
.page { --bg: var(--white); --fg: var(--ink); --q: rgba(11,11,10,.5); --hr: rgba(11,11,10,.09); --fill: #F5F5F3; --r: 12px;
  --c: #DCE8D6; --d: #4F7348;
  position: relative; container-type: inline-size; width: 100%; max-width: 1280px; height: min(860px, 84vh); background: var(--bg); color: var(--fg); border: 1px solid rgba(128,128,128,.3); overflow: hidden; font: 400 13px/1.45 var(--mono); transition: background .5s; }
.phone .page { max-width: 390px; height: min(780px, 84vh); border-radius: 28px; }
.page[data-ch="roadmap"] { --c: #DCE8D6; --d: #4F7348; }
.page[data-ch="proposal"] { --c: #F4E7B8; --d: #85691A; }
.page[data-ch="terms"] { --c: #D6E4F1; --d: #3C6286; }
.page[data-ch="start"] { --c: #F3D8CE; --d: #96503F; }
.scroller { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; }
.q { color: var(--q); }
p { margin: 0; }
.lnk { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; }
.btn { border: 1px solid var(--hr); background: var(--bg); padding: .85em 1.3em; border-radius: 999px; cursor: pointer; transition: transform .15s, background .2s; }
.btn:active { transform: scale(.97); }
.btn.solid { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); vertical-align: middle; }
.dc { position: absolute; z-index: 95; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #fff; mix-blend-mode: difference; pointer-events: none; opacity: 0; transition: opacity .2s; }
.fine .page, .fine .page * { cursor: none !important; }

/* home */
.home { min-height: 100%; padding: 20px; display: flex; flex-direction: column; }
.top { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.h-grid { display: grid; gap: 28px; padding-top: 28px; }
@container (min-width: 760px) { .h-grid { grid-template-columns: minmax(260px, 1fr) 1.6fr; gap: 40px; } }
.h-grid aside { display: grid; gap: 1em; align-content: start; }
.list { display: grid; gap: 8px; align-self: start; }
.row { width: 100%; display: grid; grid-template-columns: 30px 1fr auto; gap: 0 12px; align-items: center; padding: 14px 16px; border: 0; border-radius: var(--r); background: var(--fill); text-align: left; cursor: pointer; transition: transform .2s; }
.row:hover { transform: translateX(3px); }
.row .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--rc); }
.row.done { background: var(--rc); }
.row.done .n { background: var(--white); }
.row .st { color: var(--q); }
.row.next .st { color: var(--fg); }
.row .st::after { content: "  \2192"; }
.hcard { position: absolute; z-index: 70; width: 270px; padding: 14px 16px; background: var(--white); border: 1px solid var(--hr); border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.1); pointer-events: none; opacity: 0; transform: translateY(6px) scale(.98); transition: opacity .18s, transform .18s; display: grid; gap: .5em; }
.hcard.on { opacity: 1; transform: none; }
.foot { margin-top: auto; padding-top: 28px; display: flex; justify-content: space-between; color: var(--q); }

/* onboarding shell */
.ob { min-height: 100%; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); }
.ob-top { padding: 14px 20px 0; display: grid; gap: 12px; min-width: 0; }
.chap { display: flex; gap: 2px; padding: 3px; background: var(--fill); border-radius: 999px; width: max-content; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.chap button { background: none; border: 0; padding: 6px 12px; border-radius: 999px; color: var(--q); cursor: pointer; white-space: nowrap; transition: background .3s, color .3s; }
.chap button.on { background: var(--c); color: var(--fg); }
.chap button.done { color: var(--fg); }
.chap button.done::before { content: "\2713 "; }
.segs { display: flex; gap: 4px; }
.segs i { flex: 1; height: 4px; border-radius: 4px; background: var(--hr); transition: background .4s; }
.segs i.on { background: var(--d); }
.ob-body { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
@container (min-width: 760px) { .ob-body { grid-template-columns: minmax(0, 1fr) 300px; } }
.ob-main { position: relative; display: flex; flex-direction: column; padding: 16px 20px 20px; min-width: 0; }
.scr { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; width: 100%; max-width: 420px; margin: 0 auto; padding: 24px 0; }
.ctl { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; max-width: 420px; margin: 0 auto; }
.ctl .r { display: flex; gap: 10px; align-items: center; }
.anim > * { animation: rise .5s cubic-bezier(.2,.7,.2,1) both; }
.anim > *:nth-child(2) { animation-delay: .06s; } .anim > *:nth-child(3) { animation-delay: .12s; } .anim > *:nth-child(4) { animation-delay: .18s; } .anim > *:nth-child(5) { animation-delay: .24s; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

.kick { color: var(--q); display: flex; align-items: center; gap: 8px; }
.qt { text-wrap: wrap; }
.help { color: var(--q); }
.ops { display: grid; gap: 6px; }
.op { position: relative; overflow: hidden; isolation: isolate; display: grid; grid-template-columns: 16px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--fill); border: 1px solid transparent; border-radius: var(--r); padding: 12px 14px; cursor: pointer; transition: background .25s, border-color .25s, transform .15s; }
.op:hover { border-color: var(--hr); }
.op:active { transform: scale(.99); }
.op .mk { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(11,11,10,.28); background: var(--white); position: relative; }
.op.sq .mk { border-radius: 5px; }
.op.sel { background: var(--c); border-color: var(--d); }
.op.sel .mk { border-color: var(--d); background: var(--d); }
.op.sel .mk::after { content: "\2713"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--white); font-size: 10px; animation: pop .3s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes pop { from { transform: scale(0); } }
.op .tag { color: var(--q); }
.op.add .mk { border-style: dashed; }
.op.add .mk::after { content: "+"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; line-height: 1; }
.op.add.sel .mk::after { content: "\2713"; color: var(--white); }
.cant { justify-self: start; background: none; border: 1px dashed var(--hr); border-radius: 999px; padding: .55em 1em; color: var(--q); cursor: pointer; }
.cant.sel { border-style: solid; border-color: var(--fg); color: var(--fg); }
.in, .ta { width: 100%; border: 1px solid var(--hr); background: var(--white); padding: 12px 14px; border-radius: 12px; outline: none; }
.in:focus, .ta:focus { border-color: var(--d); box-shadow: 0 0 0 3px var(--c); }
.ta { min-height: 90px; resize: vertical; }
.reply { display: none; }
.reply.on { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start; background: var(--c); color: var(--fg); border-radius: 14px; padding: 12px 14px; line-height: 1.5; letter-spacing: -.01em; animation: note .45s cubic-bezier(.2,.8,.2,1) both; }
.reply.on::before { content: "\2713"; width: 18px; height: 18px; border-radius: 50%; background: var(--d); color: var(--white); display: grid; place-items: center; font-size: 10px; margin-top: 1px; }
.reply.on.meh::before { content: "!"; }
@keyframes note { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.rows { display: grid; gap: 6px; }
.rows > div { display: grid; grid-template-columns: 12ch 1fr; gap: 12px; padding: 12px 14px; background: var(--fill); border-radius: var(--r); }
.rows .k { color: var(--q); }
.blank { color: var(--q); border-bottom: 1px dotted var(--q); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { border: 1px solid var(--hr); background: var(--white); padding: 8px 14px; border-radius: 999px; cursor: pointer; transition: background .2s; }
.pill.sel { background: var(--c); border-color: var(--d); }
.ticks { display: grid; gap: 8px; }
.ticks span { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: center; }
.ticks span::before { content: "\2713"; width: 18px; height: 18px; border-radius: 50%; background: var(--c); color: var(--d); display: grid; place-items: center; font-size: 10px; }
.strike { color: var(--q); text-decoration: line-through; }
.cool { display: grid; gap: 12px; }
.cool .num { display: flex; gap: 10px; align-items: baseline; }
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; }
.range::-webkit-slider-runnable-track { height: 6px; border-radius: 6px; background: linear-gradient(90deg, var(--d) var(--p, 50%), var(--hr) var(--p, 50%)); }
.range::-moz-range-track { height: 6px; border-radius: 6px; background: var(--hr); }
.range::-moz-range-progress { height: 6px; border-radius: 6px; background: var(--d); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.range::-moz-range-thumb { width: 26px; height: 26px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.ends { display: flex; justify-content: space-between; color: var(--q); }

/* chapter done: a full colour moment */
.done-scr { position: relative; flex: 1; min-height: 420px; border-radius: 20px; background: var(--c); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; text-align: center; padding: 24px; animation: bloom .7s cubic-bezier(.2,.7,.2,1) both; }
@keyframes bloom { from { clip-path: circle(0 at var(--ox, 50%) var(--oy, 80%)); } to { clip-path: circle(150% at var(--ox, 50%) var(--oy, 80%)); } }
.done-scr .big { width: 64px; height: 64px; border-radius: 50%; background: var(--d); color: var(--white); display: grid; place-items: center; font-size: 22px; animation: pop .5s .25s cubic-bezier(.3,1.6,.5,1) both; }
.done-scr .pips { display: flex; gap: 6px; }
.done-scr .btn { white-space: nowrap; }
.done-scr .pips i { width: 10px; height: 10px; border-radius: 50%; background: rgba(11,11,10,.12); }
.done-scr .pips i.on { background: var(--d); }

/* clean stack: one column, lots of air; receipt only at the end of a section */
.ob-body { grid-template-columns: minmax(0, 1fr) !important; }
.ob-top { max-width: 460px; width: 100%; margin: 0 auto; padding: 18px 20px 0; }
.ob-main { padding: 12px 20px 28px; }
.scr { gap: 20px; padding: 40px 0; }
.qt { font-size: 15px; }
.done-scr { flex: 1; max-width: 460px; width: 100%; margin: 12px auto 0; padding: 32px 22px; justify-content: flex-start; }
.done-scr .wt { font-size: 15px; }
.slip-h { align-self: stretch; text-align: left; margin-top: 8px; }
.slip { align-self: stretch; text-align: left; background: var(--white); border-radius: 16px; padding: 6px 16px 14px; -webkit-mask: radial-gradient(circle at 8px 100%, transparent 5px, #000 5.5px) 0 0 / 16px 100% repeat-x; mask: radial-gradient(circle at 8px 100%, transparent 5px, #000 5.5px) 0 0 / 16px 100% repeat-x; padding-bottom: 22px; }
.slip .ln { grid-template-columns: 10px 1fr auto auto; animation: lnin .5s cubic-bezier(.2,.7,.2,1) both; }
.slip .ln:first-child { border-top: 0; }
.slip .ln:nth-child(2) { animation-delay: .08s; } .slip .ln:nth-child(3) { animation-delay: .16s; } .slip .ln:nth-child(4) { animation-delay: .24s; } .slip .ln:nth-child(5) { animation-delay: .32s; } .slip .ln:nth-child(n+6) { animation-delay: .4s; }
.slip .chg { text-decoration: underline; text-underline-offset: .2em; }
.slip-open { display: grid; gap: 4px; padding-top: 12px; margin-top: 4px; border-top: 1px dashed var(--hr); }
.slip-open .oq { background: var(--fill); border-color: transparent; }
/* welcome + home */
.welcome { flex: 1; display: grid; place-items: center; padding: 20px 0; }
.wcard { width: 100%; max-width: 420px; min-height: 300px; border-radius: 22px; padding: 26px 24px; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; }
.wpips { display: flex; gap: 5px; margin-bottom: auto; }
.wpips i { width: 18px; height: 4px; border-radius: 4px; background: rgba(11,11,10,.15); }
.wpips i.on { background: var(--ink); }
.hero { margin-top: 14px; width: 100%; text-align: left; display: grid; gap: 8px; padding: 20px; border: 0; border-radius: 20px; background: var(--rc); cursor: pointer; transition: transform .2s; }
.hero:hover { transform: translateY(-2px); }
.hero .go { margin-top: 10px; justify-self: start; background: var(--ink); color: var(--white); padding: .7em 1.1em; border-radius: 999px; }
.home-open summary { cursor: pointer; padding: 12px 0 8px; list-style: none; color: var(--q); }
.home-open summary::-webkit-details-marker { display: none; }
.home-open summary::after { content: "  +"; }
.home-open[open] summary::after { content: "  \2013"; }
.home-open .open-h { display: none; }
/* still to answer */
.opnl { padding: 10px 0 6px; border-top: 1px solid var(--hr); margin-top: 6px; }
.open-h { padding: 4px 0 6px; }
.open { display: grid; gap: 4px; }
.oq { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; width: 100%; text-align: left; background: var(--white); border: 1px solid var(--hr); border-radius: 10px; padding: 8px 10px; cursor: pointer; transition: border-color .2s, transform .2s; }
.oq:hover { border-color: var(--fg); transform: translateX(2px); }
.home-open, .done-open { width: 100%; max-width: 340px; text-align: left; }
.home-open .oq { background: var(--fill); border-color: transparent; }
.ext { color: var(--d); text-decoration: underline; text-underline-offset: .2em; white-space: nowrap; }
/* toast */
.toast { position: absolute; z-index: 40; left: 50%; bottom: 76px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 999px; white-space: nowrap; display: flex; gap: 8px; align-items: center; animation: toast 1.8s cubic-bezier(.2,.7,.2,1) both; pointer-events: none; }
.toast .dot { background: var(--c); }
.toast { animation: toast 2s cubic-bezier(.3,1.5,.5,1) both; overflow: visible; }
.burst { position: absolute; left: 50%; top: 50%; pointer-events: none; }
.burst i { position: absolute; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; animation: burst .7s cubic-bezier(.2,.7,.2,1) .05s both; }
@keyframes burst { from { transform: translate(0, 0) scale(.4); opacity: 1; } to { transform: translate(var(--x), var(--y)) scale(1); opacity: 0; } }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 14px) scale(.8); } 15%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -4px); } }

/* joke */
.alert-bg { position: absolute; inset: 0; z-index: 80; background: rgba(0,0,0,.25); animation: fade .2s both; }
.alert { position: absolute; z-index: 81; left: 50%; top: 50%; width: min(320px, calc(100% - 40px)); transform: translate(-50%, -50%); background: var(--white); border-radius: 18px; padding: 24px 20px 16px; text-align: center; display: grid; gap: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.25); animation: alert .35s cubic-bezier(.3,1.4,.5,1) both; }
.alert .x { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--fill); cursor: pointer; }
.alert .huge { font-variant-numeric: tabular-nums; word-break: break-all; padding: 10px; border-radius: 10px; background: #F6D5CB; }
.alert .btn { width: 100%; }
@keyframes alert { from { opacity: 0; transform: translate(-50%, -50%) scale(1.1); } }
.shake { animation: shake .5s both; }
@keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }

/* receipt */
.bk { display: flex; flex-direction: column; padding: 16px 20px 20px 0; min-width: 0; }
.rc { flex: 1; display: flex; flex-direction: column; background: var(--fill); border-radius: 16px; padding: 14px 16px; min-height: 0; overflow: auto; }
.bk-h { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; width: 100%; }
.ln { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 9px 0; border-top: 1px dashed var(--hr); }
.ln .k { color: var(--q); }
.ln .v { text-align: right; max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ln .v.cn { color: var(--q); }
.ln.new { animation: lnin .6s cubic-bezier(.2,.7,.2,1) both; }
@keyframes lnin { from { opacity: 0; transform: translateY(-6px); background: var(--c); } 40% { background: var(--c); } }
.bk-t { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--fg); display: flex; justify-content: space-between; align-items: baseline; }
.bk-t .strike { margin-right: 8px; }
.meter { height: 4px; border-radius: 4px; background: var(--hr); overflow: hidden; margin: 4px 0 10px; }
.meter i { display: block; height: 100%; background: var(--d); transition: width .5s; }
@container (max-width: 759px) {
  .bk { position: sticky; bottom: 0; z-index: 20; padding: 0 12px 12px; background: linear-gradient(transparent, var(--bg) 30%); }
  .rc { max-height: 280px; background: var(--white); border: 1px solid var(--hr); box-shadow: 0 -4px 24px rgba(0,0,0,.06); }
  .bk.shut .ln, .bk.shut .meter { display: none; } .bk.shut .bk-t { border-top: 0; padding-top: 2px; }
  .toast { bottom: 120px; }
}
.sheet-bg { position: absolute; inset: 0; z-index: 60; background: rgba(0,0,0,.25); animation: fade .25s both; }
.sheet { position: absolute; z-index: 61; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 540px; background: var(--white); border-radius: 22px 22px 0 0; padding: 10px 20px 24px; display: grid; gap: 14px; animation: up .45s cubic-bezier(.16,1,.3,1) both; box-shadow: 0 -10px 40px rgba(0,0,0,.15); }
.sheet::before { content: ""; justify-self: center; width: 36px; height: 5px; border-radius: 5px; background: var(--hr); margin-bottom: 6px; }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }

/* ---------- take 1: chapter colours (the base above) ---------- */

/* ---------- take 2: colour cards: each screen is a card in the chapter colour, the next one peeks ---------- */
.s-cards .scr { background: var(--c); border-radius: 20px; padding: 26px 22px; flex: 0 0 auto; margin: auto; position: relative; box-shadow: 0 1px 0 rgba(0,0,0,.04); }
.s-cards .scr::before, .s-cards .scr::after { content: ""; position: absolute; z-index: -1; left: 14px; right: 14px; bottom: -8px; height: 20px; border-radius: 0 0 18px 18px; background: var(--c); opacity: .6; }
.s-cards .scr::after { left: 28px; right: 28px; bottom: -16px; opacity: .35; }
.s-cards .scr.anim { animation: cardin .55s cubic-bezier(.2,.8,.2,1) both; }
.s-cards .scr.anim > * { animation: none; }
@keyframes cardin { from { opacity: 0; transform: translateX(40px) rotate(1.5deg); } }
.s-cards .op, .s-cards .rows > div { background: rgba(255,255,255,.65); }
.s-cards .op.sel { background: var(--white); }
.s-cards .ctl { margin-top: 18px; }

/* ---------- take 3: splash: white and calm, colour blooms where you tap ---------- */
.s-splash .op.sel { background: var(--fill); border-color: transparent; }
.splash { position: absolute; z-index: -1; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--c); animation: splash .6s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes splash { to { transform: scale(60); } }
.s-splash .segs { display: none; }
.s-splash .ring { --pc: 0; width: 34px; height: 34px; border-radius: 50%; background: conic-gradient(var(--d) calc(var(--pc) * 1%), var(--hr) 0); display: grid; place-items: center; }
