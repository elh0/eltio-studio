<!doctype html>
<html lang="en"><head>
<meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Out &amp; Scout outline prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400&family=Geist+Mono:wght@400&display=swap">
<style>
/* Outline look, round 2 (8 Oct): hairline rounded cards and pills, hover rings, white frame window, big mm you drag to change lens */
:root{--ink:#121211;--paper:#ecebe6;--grey:#8c8a83;--line:rgba(236,235,230,.42);--hair:#2a2926;--card:#1a1a19;--sun:#FF5A1F;
--sans:'Geist',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden}
#fit{position:relative;width:844px;height:390px;transform-origin:0 0;overflow:hidden;background:var(--ink);color:var(--paper);font:10px/1.3 var(--mono);letter-spacing:.06em;user-select:none;touch-action:none}
#fit.p{width:390px;height:844px}
#fit>div,.abs{position:absolute}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
button:focus-visible{outline:1px solid var(--sun);outline-offset:3px}
.up{text-transform:uppercase}
.g{color:var(--grey)}
.sans{font-family:var(--sans);letter-spacing:0}
.wm{font:400 30px/1 var(--sans);letter-spacing:-.03em;word-spacing:.3em;white-space:nowrap}
.wm i{display:inline-block;width:.22em;height:.22em;border-radius:50%;background:var(--sun);vertical-align:.55em;margin:0 .5em 0 .45em}
.card{border:1.5px solid var(--line);border-radius:14px;text-align:left;padding:12px 16px;box-sizing:border-box;transition:border-color .2s,box-shadow .2s}
.card:hover,.card.on{border-color:var(--paper)}
.card:hover{box-shadow:0 0 0 4px rgba(236,235,230,.12)}
.card b{display:block;color:var(--paper);font:400 15px/1.2 var(--sans);letter-spacing:0}
.card span{display:block;margin-top:5px;color:var(--grey);font-size:9px}
.pill{border:1px solid var(--line);border-radius:99px;min-width:38px;height:26px;padding:0 11px;box-sizing:border-box;font-size:10px;letter-spacing:.03em;transition:box-shadow .15s,border-color .15s;white-space:nowrap}
.pill:hover{border-color:var(--paper);box-shadow:0 0 0 3px rgba(236,235,230,.16)}
.pill.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.pill.big{height:34px;padding:0 18px;font-size:11px}
.pill.sm{height:22px;min-width:34px;padding:0 8px}
.side button{display:block;text-align:left;min-height:24px;font-size:10px}
.win{border:2px solid var(--paper);box-sizing:border-box;overflow:hidden;background:#000;position:absolute}
.win img{position:absolute;left:50%;top:50%}
.shut{width:56px;height:56px;border-radius:50%;border:2px solid var(--paper);display:flex;align-items:center;justify-content:center;box-sizing:border-box;transition:box-shadow .15s}
.shut:hover{box-shadow:0 0 0 4px rgba(236,235,230,.14)}
.shut span{width:44px;height:44px;border-radius:50%;background:#c9c8c3;display:block;transition:transform .1s}
.shut:active span{transform:scale(.9)}
#flash{inset:0;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .25s}
input,.ed{font:400 22px/1 var(--sans);color:var(--paper);background:none;border:0;outline:0;letter-spacing:-.01em;caret-color:var(--paper)}
.ed{border-bottom:1px dashed transparent;cursor:text;transition:border-color .15s;min-width:20px;display:inline-block}
.ed:hover{border-color:var(--grey)}
.ed:focus{border-bottom:1px solid var(--paper)}
.paper .ed:hover{border-color:#8c8a83}.paper .ed:focus{border-color:#121211}
.row{display:flex;align-items:center;gap:12px;border-top:1px solid var(--hair);padding:7px 0}
.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:18px;box-sizing:border-box}
.scrim{inset:0;background:rgba(10,10,9,.72)}
.tick{display:inline-block;width:10px;height:10px;border:1px solid var(--line);border-radius:3px;margin-right:6px;vertical-align:-1px}
.tick.on{background:var(--paper);border-color:var(--paper)}
.paper{background:#f3f3f0;color:#121211;border-radius:3px;box-shadow:0 6px 30px rgba(0,0,0,.5)}
.chip{background:rgba(18,18,17,.82);border:1px solid var(--line);border-radius:99px;padding:5px 10px;white-space:nowrap}
</style></head><body>
<div id="fit"></div>
<script>
var $=function(id){return document.getElementById(id)};

var KIT={cam:'ALEXA 35',set:'Primes',lenses:[14,18,24,32,35,40,50,65,85]};

var SETS=['Primes','Zoom 24–70','Anamorphic 2×','Your own lenses'];
var PJ=[{n:'Second Recce',date:'8 Oct 2026',crew:'',sc:[{n:'Scene 1',img:'img/knole.jpg'}],shots:[]},
 {n:'First Recce',date:'4 Oct 2026',crew:'Dir. Charlie · DP Elliot',shoot:'Thu 9 Oct',wx:{sky:'Sunny spells',hi:16,lo:9,rain:5,wind:12,cloud:20},sc:[{n:'Camberwell Church St',img:'img/8a.jpg',where:'Camberwell, London',pc:'SE5 8QZ',park:'Pay and display on Grove Lane',walk:'2 min',kind:'street'},{n:'Scene 6',img:'img/6a.jpg',where:'Kennington, London',pc:'SE11 4AN',park:'Residents only, use Kennington Park Road',walk:'5 min',kind:'street'},{n:'Knole Park',img:'img/knole.jpg',where:'Sevenoaks, Kent',pc:'TN15 0RP',park:'National Trust car park, shuts 18:00',walk:'12 min',kind:'park'}],shots:[
 {id:'1A',img:'img/8a.jpg',sc:0,mm:32,r:'16:9',t:482,h:70,cap:'Medium wide, person by the plant',notes:'Bench is council owned. Quiet before 9.'},
 {id:'2A',img:'img/6a.jpg',sc:1,mm:18,r:'16:9',t:679,h:165,cap:'Wide, street under the trees',notes:''},
 {id:'2B',img:'img/18a.jpg',sc:1,mm:40,r:'16:9',t:683,h:20,cap:'Mid, lamppost in dappled shade',notes:''},
 {id:'3A',img:'img/knole.jpg',sc:2,mm:32,r:'16:9',t:957,h:65,cap:'Wide, lone tree on the ridge',notes:'Car park closes 18:00. Deer about.'},
 {id:'1B',img:'img/8a.jpg',sc:0,mm:50,r:'16:9',t:490,h:100,cap:'Close, hands on the bench',notes:''},
 {id:'1C',img:'img/18a.jpg',sc:0,mm:24,r:'2.39',t:500,h:250,cap:'Wide, the street behind her',notes:'Bus stop in frame, lose it on 32'},
 {id:'2C',img:'img/6a.jpg',sc:1,mm:32,r:'16:9',t:690,h:200,cap:'Mid, car door, kerb side',notes:''},
 {id:'2D',img:'img/18a.jpg',sc:1,mm:65,r:'16:9',t:700,h:300,cap:'Close, lamp head against the leaves',notes:''},
 {id:'3B',img:'img/knole.jpg',sc:2,mm:85,r:'2.39',t:965,h:230,cap:'Long lens, the two of them on the ridge',notes:''},
 {id:'3C',img:'img/knole.jpg',sc:2,mm:18,r:'2.39',t:1085,h:260,cap:'Wide, the tree at golden hour',notes:'Be set up by 17:30'},
 {id:'3D',img:'img/knole.jpg',sc:2,mm:50,r:'2.39',t:1100,h:280,cap:'Silhouette, sun behind the tree',notes:''}]},
 {n:'Night Shift',date:'2 Oct 2026',crew:'',sc:[{n:'Brick Lane',img:'img/18a.jpg'},{n:'Arches',img:'img/6a.jpg'}],shots:[{id:'1A',img:'img/18a.jpg',sc:0,mm:35,r:'2.39',t:1110,h:250,cap:'Mid, lamp on the wall',notes:'Shop lights on at 18:00'},{id:'2A',img:'img/6a.jpg',sc:1,mm:24,r:'2.39',t:1115,h:120,cap:'Wide, the arches',notes:''}]}];
var S={scr:'start',sv:'b2',sel:null,newp:false,p:0,sc:0,mm:24,r:'2.39',t:NOW,head:247,shot:-1,filt:-1,path:true,grid:false,level:false,o:'l',sheet:'',addsc:false,chip:'',
 ex:{zoom:.32,scope:'all',tier:'detailed',frames:true,sun:true,notes:true,file:'',state:'',page:0},wx:false};
function hm(m){m=Math.round(m);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function sunAz(m){return 98+(Math.max(RISE,Math.min(SET,m))-RISE)/(SET-RISE)*164}
function sunEl(m){return 29*Math.sin(Math.PI*Math.max(0,Math.min(1,(m-RISE)/(SET-RISE))))}
function rel(az,h){return ((az-h)%360+540)%360-180}
var CL=['Backlit','¾ backlit','Side lit','¾ front lit','Front lit'];
function cls(r){var a=Math.abs(r);return a<=30?0:a<=75?1:a<=105?2:a<=150?3:4}
function light(m,h,long){if(m<RISE||m>SET)return 'Sun down';var r=rel(sunAz(m),h),s=Math.abs(r)>8&&Math.abs(r)<172?(r>0?(long?', sun on the right':' · right'):(long?', sun on the left':' · left')):'';return CL[cls(r)]+s}
function facing(h){return ['north','north-east','east','south-east','south','south-west','west','north-west'][Math.round(h/45)%8]}
function best(h){var g=cls(rel(sunAz(1098),h));if(g<=2)return 'Golden hour, '+hm(GH)+'–'+hm(SET);for(var m=RISE;m<SET;m+=5)if(cls(rel(sunAz(m),h))<=1&&sunEl(m)>=6)return hm(m)+'–'+hm(Math.min(SET,m+60))+', '+CL[cls(rel(sunAz(m),h))].toLowerCase();return 'Golden hour, '+hm(GH)+'–'+hm(SET)}
function wm(px){return '<span class="wm" style="font-size:'+px+'px">Out &amp; Sc<i></i>out</span>'}
PJ.forEach(function(p){p.shots.sort(function(a,b){return a.sc-b.sc||a.id.localeCompare(b.id)})});
function pj(){return PJ[S.p]}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function ed(key,val,style,ph){return '<span class="ed" contenteditable="true" spellcheck="false" data-ed="'+key+'" data-ph="'+(ph||'')+'" style="'+(style||'')+'">'+esc(val)+'</span>'}
function img(src,w,h,extra){return '<span class="abs" style="'+(extra||'')+'width:'+w+'px;height:'+h+'px;background:#222 url('+src+') center/cover"></span>'}

/* ---------- start screen: four layouts ---------- */
function others(){return PJ.map(function(x,i){return i}).filter(function(i){return i!==S.p})}
function newField(x,y,w){return '<div style="left:'+x+'px;width:'+w+'px;top:'+y+'px"><div class="g up" style="font-size:8px">Project name</div><div style="display:flex;align-items:center;border-bottom:1.5px solid var(--line);padding:6px 0 8px"><input id="pn" placeholder="Untitled" style="flex:1"><button data-create class="pill up">Start</button></div></div>'}
function startA(){var c=pj();
  return '<div style="left:0;right:0;top:58px;text-align:center">'+wm(30)+'</div>'
   +'<div style="left:212px;top:118px;display:flex;gap:20px">'
   +'<button data-go="cam" class="card" style="width:200px;height:66px"><b>Continue</b><span class="up">'+c.n+' · '+c.sc.length+' scene'+(c.sc.length>1?'s':'')+'</span></button>'
   +'<button data-newp class="card'+(S.newp?' on':'')+'" style="width:200px;height:66px"><b>New project</b><span class="up">Straight to the camera</span></button></div>'
   +(S.newp?newField(212,236,420):'<div style="left:212px;width:420px;top:226px"><div class="g up" style="font-size:8px;margin-bottom:4px">All projects</div>'+others().map(function(i){var x=PJ[i];return '<button data-pj="'+i+'" class="row" style="width:100%;justify-content:space-between"><span class="sans" style="font-size:13px">'+x.n+'</span><span class="g up">'+x.sc.length+' scenes · '+x.shots.length+' shots</span></button>'}).join('')+'</div>')}
function lastImg(x){return (x.shots[x.shots.length-1]||{}).img||x.sc[0].img}
function newCard(h){return S.newp?'<div class="sheet" style="padding:14px"><div class="g up" style="font-size:8px">Project name</div><input id="pn" placeholder="Untitled" style="width:100%;font-size:18px;margin:8px 0 12px;border-bottom:1.5px solid var(--line);padding-bottom:6px"><div style="display:flex;gap:6px"><button data-newp class="pill up" style="flex:1">Cancel</button><button data-create class="pill on up" style="flex:1">Start</button></div></div>'
  :'<button data-newp class="card" style="width:100%;height:'+h+'px;display:flex;flex-direction:column;justify-content:flex-end"><b style="font-size:26px;line-height:1;margin-bottom:auto">+</b><b>New project</b><span class="up">Straight to the camera</span></button>'}
function startB(){ // B1: every recce is a row with its last frame; tap opens it
  var rows=PJ.map(function(x,i){return '<button data-pj="'+i+'" class="card" style="display:flex;align-items:center;gap:14px;width:100%;height:58px;padding:8px 14px;margin-bottom:8px;'+(i===S.p?'border-color:var(--paper)':'')+'"><span style="position:relative;width:64px;height:36px;flex:none;border-radius:6px;overflow:hidden">'+img(lastImg(x),64,36,'left:0;top:0;')+'</span><span style="flex:1"><b>'+x.n+'</b><span class="up">'+x.date+' · '+x.sc.length+' scenes · '+x.shots.length+' shots</span></span>'+(i===S.p?'<span class="up" style="margin:0;color:var(--paper)">Continue →</span>':'')+'</button>'}).join('');

function startB2(){ // B2: list on the left, the picked recce previewed on the right before you open it
  var sel=S.sel==null?S.p:S.sel,x=PJ[sel],nx=x.shots.length,sh=x.shots.slice(-3);
  var rows='<button data-newp class="row up" style="width:100%;gap:10px;border-top:0;color:var(--paper);min-height:40px"><span class="pill sm" style="display:inline-flex;align-items:center;justify-content:center;min-width:26px;padding:0">+</span>New project</button>'

  return '<div style="left:36px;top:30px">'+wm(20)+'</div>'
   +'<div style="left:36px;top:66px;width:270px;height:310px;overflow:auto;padding:0 10px;box-sizing:border-box">'+rows+'</div>'
   +'<div class="sheet" style="left:330px;top:26px;right:26px;bottom:26px;padding:16px;display:flex;gap:16px">'
   +'<span style="position:relative;width:250px;height:'+Math.round(250*9/16)+'px;flex:none;border-radius:10px;overflow:hidden">'+img(lastImg(x),250,141,'left:0;top:0;')+'</span>'
   +'<div style="flex:1;display:flex;flex-direction:column;min-width:0"><div class="sans" style="font-size:20px">'+x.n+'</div><div class="up g" style="margin-top:4px">'+x.date+(x.crew?' · '+x.crew:'')+'</div>'
   +'<div class="up g" style="margin-top:12px;font-size:8px">Scenes</div><div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:5px">'+x.sc.map(function(s,i){return '<button class="pill sm" data-open="'+sel+'" data-osc="'+i+'">'+s.n+'</button>'}).join('')+'</div>'
   +'<div class="up g" style="margin-top:12px;font-size:8px">Next good light</div><div class="sans" style="margin-top:3px;font-size:12px">'+(nx?x.shots[nx-1].id+' · '+best(x.shots[nx-1].h):'Golden hour '+hm(GH)+'–'+hm(SET))+'</div>'
   +'<div style="margin-top:auto;display:flex;gap:6px;flex-wrap:wrap"><button class="pill on up" data-open="'+sel+'">Open camera</button><button class="pill up" data-open="'+sel+'" data-to="list">Shots · '+nx+'</button>'+(nx?'<button class="pill up" data-open="'+sel+'" data-to="export">Export</button>':'')+'</div></div>'
   +(sh.length?'<div style="position:absolute;left:16px;bottom:16px;display:flex;gap:6px">'+sh.map(function(s){return '<span style="position:relative;width:79px;height:44px;border-radius:5px;overflow:hidden;display:block">'+img(s.img,79,44,'left:0;top:0;')+'</span>'}).join('')+'</div>':'')+'</div>'}
function startB3(){ // B3: one wide row per recce, its frames as a strip, and the three things you do with it
  var groups=[['This week',PJ.filter(function(p){return /Oct/.test(p.date)&&parseInt(p.date)>=5})],['Earlier',PJ.filter(function(p){return !(/Oct/.test(p.date)&&parseInt(p.date)>=5)})]];
  var body=groups.filter(function(g){return g[1].length}).map(function(g){return '<div class="up g" style="font-size:8px;margin:10px 0 6px">'+g[0]+'</div>'+g[1].map(function(p){var i=PJ.indexOf(p),fr=p.shots.slice(0,4);
    return '<div class="card" style="display:flex;align-items:center;gap:14px;padding:10px 12px;margin-bottom:8px;'+(i===S.p?'border-color:var(--paper)':'')+'"><button data-pj="'+i+'" style="flex:1;display:flex;align-items:center;gap:14px;text-align:left;min-width:0"><span style="display:flex;gap:3px;width:200px;flex:none">'+(fr.length?fr.map(function(s){return '<span style="position:relative;width:48px;height:30px;border-radius:3px;overflow:hidden;display:block">'+img(s.img,48,30,'left:0;top:0;')+'</span>'}).join(''):'<span style="position:relative;width:48px;height:30px;border-radius:3px;overflow:hidden;display:block;opacity:.6">'+img(p.sc[0].img,48,30,'left:0;top:0;')+'</span><span class="g up" style="font-size:8px;align-self:center;margin-left:6px">No shots yet</span>')+'</span>'
     +'<span style="min-width:0"><b>'+p.n+'</b><span class="up">'+p.date+' · '+p.sc.length+' scenes · '+p.shots.length+' shots</span></span></button>'
     +'<span style="display:flex;gap:6px;flex:none"><button class="pill sm up on" data-open="'+i+'">Camera</button><button class="pill sm up" data-open="'+i+'" data-to="list">Shots</button>'+(p.shots.length?'<button class="pill sm up" data-open="'+i+'" data-to="export">Export</button>':'')+'</span></div>'}).join('')}).join('');

   +'<div style="left:40px;right:40px;top:52px;bottom:10px;overflow:auto">'+body+'</div>'}
function startC(){ // today: the day's light leads, then one big continue
  var W=420,X=function(m){return (m-RISE)/(SET-RISE)*W},d='';for(var m=RISE;m<=SET;m+=6)d+=(d?'L':'M')+X(m).toFixed(1)+' '+(70-sunEl(m)*2).toFixed(1);var g='';for(var m2=GH;m2<=SET;m2+=4)g+=(g?'L':'M')+X(m2).toFixed(1)+' '+(70-sunEl(m2)*2).toFixed(1);
  var c=pj();
  return '<div style="left:0;right:0;top:30px;text-align:center">'+wm(24)+'</div>'
   +'<div style="left:212px;top:70px;width:'+W+'px"><svg width="'+W+'" height="80" style="overflow:visible"><line x1="0" y1="70" x2="'+W+'" y2="70" stroke="rgba(236,235,230,.3)"/><path d="'+d+'" fill="none" stroke="rgba(236,235,230,.55)" stroke-dasharray="2 3"/><path d="'+g+'" fill="none" stroke="#FF5A1F" stroke-width="2"/><circle cx="'+X(NOW)+'" cy="'+(70-sunEl(NOW)*2)+'" r="6" fill="#FF5A1F"/></svg>'
   +'<div class="up" style="display:flex;justify-content:space-between;margin-top:4px"><span class="g">Sunrise '+hm(RISE)+'</span><span>Today · London</span><span class="g">Golden '+hm(GH)+'</span><span class="g">Sunset '+hm(SET)+'</span></div></div>'
   +'<div style="left:212px;top:192px;display:flex;gap:14px">'
   +'<button data-go="cam" class="card" style="width:270px;height:96px;display:flex;gap:14px;align-items:center;padding:10px"><span style="position:relative;width:96px;height:74px;flex:none;border-radius:8px;overflow:hidden">'+img(c.sc[0].img,96,74,'left:0;top:0;')+'</span><span><b>Continue</b><span class="up">'+c.n+'</span><span class="up">'+c.sc.length+' scenes · '+c.shots.length+' shots</span></span></button>'
   +'<button data-newp class="card'+(S.newp?' on':'')+'" style="width:136px;height:96px;display:flex;flex-direction:column;justify-content:flex-end"><b>New</b><span class="up">project</span></button></div>'
   +(S.newp?newField(212,306,420):'<div class="up" style="left:212px;top:306px;display:flex;gap:16px">'+others().map(function(i){return '<button data-pj="'+i+'" class="g" style="border-bottom:1px solid var(--hair)">'+PJ[i].n+'</button>'}).join('')+'</div>')}
