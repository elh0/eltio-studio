<style>
/* Deck: a phase-two idea. Leo's work as the tracklist on a see-through CDJ.
   Two takes: a line drawing (nothing flies) and a 3D deck in a gallery (the camera flies into the screen). */
.modes { position: fixed; z-index: 41; top: calc(env(safe-area-inset-top, 0px) + var(--pad) + 26px); left: 50%; transform: translateX(-50%); display: flex; gap: 16px; }
.modes button { opacity: .38; transition: opacity .2s; }
.modes button[aria-pressed="true"], .modes button:hover { opacity: 1; }

/* line drawing */
#wire { position: fixed; inset: 0; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 84px) max(var(--pad), env(safe-area-inset-right, 0px)) 80px max(var(--pad), env(safe-area-inset-left, 0px)); }
.w-grid { display: grid; gap: 34px; max-width: 1180px; margin: 0 auto; align-items: center; }
@media (min-width: 900px) { .w-grid { grid-template-columns: minmax(0, 460px) minmax(0, 1fr); gap: 6vw; min-height: calc(100vh - 170px); } }
.deck { position: relative; width: 100%; max-width: 440px; margin: 0 auto; }
.deck svg { display: block; width: 100%; height: auto; stroke: var(--fg); stroke-width: 1; fill: none; overflow: visible; }
.deck svg * { vector-effect: non-scaling-stroke; }
.deck .hit { cursor: pointer; fill: var(--bg); transition: fill .2s; }
.deck .hit:hover { fill: color-mix(in srgb, var(--fg) 10%, var(--bg)); }
.deck .hit.on { fill: var(--fg); }
.deck .glyph { fill: var(--fg); stroke: none; pointer-events: none; }
.deck .hit.on + .glyph { fill: var(--bg); }
.deck text { fill: var(--fg); stroke: none; font: 400 7.5px var(--mono); letter-spacing: .06em; text-anchor: middle; pointer-events: none; }
.deck .on-t { fill: var(--bg); }
.jog { transform-box: view-box; transform-origin: 180px 316px; }
.playing .jog { animation: spin 3.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.screen { position: absolute; left: 19.44%; top: 7.23%; width: 61.11%; height: 27.23%; display: grid; grid-template-rows: auto 1fr; overflow: hidden; font-size: clamp(8.5px, 2.4vw, 10.5px); line-height: 1.3; }
.screen .tb { display: flex; justify-content: space-between; padding: 4px 7px; border-bottom: 1px solid color-mix(in srgb, var(--fg) 30%, transparent); text-transform: uppercase; letter-spacing: .05em; }
.screen .rows { padding-top: 2px; }
.screen button { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 4px; width: 100%; text-align: left; padding: 1.5px 7px; }
.screen button span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.screen button[aria-current="true"] { background: var(--fg); color: var(--bg); }
.now { display: grid; gap: 14px; min-width: 0; }
.now .big { margin: 0; overflow-wrap: anywhere; }
.now .line { display: flex; justify-content: space-between; gap: 12px; }
.now .film { width: 100%; aspect-ratio: 2.42; }
.lanes { display: grid; gap: 8px; }
.lane { display: grid; grid-template-columns: 8.5em minmax(0, 1fr); gap: 10px; align-items: center; }
.lane svg { height: 22px; width: 100%; stroke: var(--fg); stroke-width: 1; fill: none; }
.lane svg * { vector-effect: non-scaling-stroke; }
.lane .done { opacity: 1; } .lane .todo { opacity: .25; }

/* bands behind the corners so scrolled content never runs under them */
.band { position: fixed; left: 0; right: 0; z-index: 39; background: var(--bg); transition: background .5s var(--ease); }
.band.t { top: 0; height: calc(env(safe-area-inset-top, 0px) + 66px); }
.band.b { bottom: 0; height: calc(env(safe-area-inset-bottom, 0px) + 46px); }
body.three .band { display: none; }

/* 3D */
#three { position: fixed; inset: 0; background: #050505; }
#three canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
body.three { --bg: #050505; --fg: #F4F2ED; }
body.three.lit { --fg: #151413; }
body.three.lit .corner, body.three.lit .modes { color: #151413; }
.three-bar { position: fixed; z-index: 42; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 46px); display: flex; justify-content: center; align-items: center; gap: 18px; padding: 0 var(--pad); pointer-events: none; }
.three-bar > * { pointer-events: auto; }
.three-bar .hint { opacity: .5; text-align: center; }
.three-bar button { white-space: nowrap; padding: 8px 16px; border: 1px solid currentColor; border-radius: 999px; }
.three-bar button[hidden] { display: none; }
@media (max-width: 600px) { .three-bar .hint { font-size: 11px; } }
[hidden] { display: none !important; }
</style>

<script src="../shared.js"></script>
<script>
var SYM = { comp: '●', sd: '↪', mix: '⇥' }, KEYS = ['all', 'comp', 'sd', 'mix'];
var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function symTxt(t) { return t.map(function (k) { return SYM[k]; }).join(' '); }
function n2(i) { return (i < 9 ? '0' : '') + (i + 1); }
function rng(s) { return function () { s = (s * 16807 + 11) % 2147483647; return (s % 10000) / 10000; }; }
var IMGS = WORK.map(function (w) { var im = new Image(); im.src = still(w); return im; });

/* ---------- the line drawing ---------- */
var HC = { sel: 0, tag: 'all', play: false, pos: 0, t0: 0 };
/* the helix: a Fermat double spiral, two arms turning out from the centre, symmetric about it */
(function () {
  var d = '', R = 34, turns = 2.6, max = turns * 2 * Math.PI;
  [0, Math.PI].forEach(function (off) {
    for (var th = 0; th <= max; th += .06) {
      var r = R * Math.sqrt(th / max), a = th + off;
      d += (th ? 'L' : 'M') + (180 + Math.cos(a) * r).toFixed(2) + ' ' + (316 + Math.sin(a) * r).toFixed(2);
    }
  });
  document.getElementById('helix').setAttribute('d', d);
})();
function hcList() { return WORK.map(function (w, i) { return i; }).filter(function (i) { return HC.tag === 'all' || WORK[i].t.indexOf(HC.tag) > -1; }); }
function wave(seed, n) { var d = ''; for (var x = 0; x <= 400; x += 3) { var v = Math.abs(Math.sin(x * (.05 + n * .02) + seed) * Math.sin(x * .013 + seed * 2)) * 9 + .6; d += 'M' + x + ' ' + (11 - v).toFixed(1) + 'V' + (11 + v).toFixed(1); } return d; }
function renderH(full) {
  var L = hcList(), at = Math.max(0, L.indexOf(HC.sel)), start = Math.max(0, Math.min(at - 2, L.length - 6)), i = HC.sel, w = WORK[i];
  document.getElementById('rows').innerHTML = L.slice(start, start + 6).map(function (j) { return '<button type="button" data-row="' + j + '" aria-current="' + (j === i) + '"><span>' + n2(j) + '</span><span>' + WORK[j].c + '</span><span>' + symTxt(WORK[j].t) + '</span></button>'; }).join('');
  document.getElementById('s-tag').textContent = (HC.tag === 'all' ? 'All' : TAGS[HC.tag]) + ' (' + L.length + ')';
  document.querySelectorAll('#deck .hit').forEach(function (p) {
    var r = p.getAttribute('data-r'), on = (r === 'play' && HC.play) || (r.indexOf('tag') === 0 && KEYS[+r.slice(3)] === HC.tag);
    p.classList.toggle('on', on);
    var t = document.querySelector('[data-t="' + r + '"]'); if (t) t.classList.toggle('on-t', on);
  });
  document.getElementById('pg').setAttribute('d', HC.play ? 'M38 418h4v16h-4zM46 418h4v16h-4z' : 'M39 418v16l13-8z');
  document.getElementById('wire').classList.toggle('playing', HC.play);
  if (full) {
    document.getElementById('n-name').textContent = w.c;
    document.getElementById('n-proj').textContent = w.p;
    var img = document.querySelector('#n-film img'); img.style.opacity = 0; setTimeout(function () { img.src = still(w); img.style.opacity = 1; }, 180);
    document.getElementById('lanes').innerHTML = w.t.map(function (k, n) { return '<div class="lane"><span>' + SYM[k] + ' ' + TAGS[k] + '</span><svg viewBox="0 0 400 22" preserveAspectRatio="none"><clipPath id="c' + n + '"><rect class="clip" width="0" height="22"/></clipPath><path class="todo" d="' + wave(i * 3 + n, n) + '"/><path class="done" clip-path="url(#c' + n + ')" d="' + wave(i * 3 + n, n) + '"/></svg></div>'; }).join('');
  }
  document.getElementById('n-film').classList.toggle('on', HC.play);
}
function hTick() {
  var w = WORK[HC.sel], len = secs(w.d);
  if (HC.play) { HC.pos = (performance.now() - HC.t0) / 1000; if (HC.pos >= len) { hGo(1); HC.t0 = performance.now(); HC.pos = 0; } }
  document.getElementById('s-time').textContent = clock(HC.pos).replace(/^0/, '');
  document.getElementById('n-time').textContent = clock(HC.pos) + ' / ' + w.d;
  document.querySelectorAll('#lanes .clip').forEach(function (c) { c.setAttribute('width', HC.pos / len * 400); });
  document.getElementById('fader').setAttribute('y', 300 + Math.sin(HC.pos * .4) * (HC.play ? 6 : 0));
  requestAnimationFrame(hTick);
}
function hGo(s) { var L = hcList(), at = L.indexOf(HC.sel); HC.sel = L[(Math.max(0, at) + s + L.length) % L.length]; HC.pos = 0; HC.t0 = performance.now(); renderH(true); }
function hPlay(on) { HC.play = on; HC.t0 = performance.now() - HC.pos * 1000; renderH(false); }
document.getElementById('deck').addEventListener('click', function (e) {
  var row = e.target.closest('[data-row]');
  if (row) { HC.sel = +row.getAttribute('data-row'); HC.pos = 0; renderH(true); hPlay(true); return; }
  var h = e.target.closest('[data-r]'); if (!h) return; var r = h.getAttribute('data-r');
  if (r === 'play') hPlay(!HC.play);
  else if (r === 'cue') { HC.pos = 0; hPlay(false); }
  else if (r === 'prev') hGo(-1);
  else if (r === 'next') hGo(1);
  else { HC.tag = KEYS[+r.slice(3)]; var L = hcList(); if (L.indexOf(HC.sel) < 0) { HC.sel = L[0]; HC.pos = 0; renderH(true); } else renderH(false); }
});
renderH(true); hTick();

/* ---------- the 3D deck ----------
   Flat on a gallery table, clear shell. The four pads under the screen filter (All / Composition / Sound design / Mix),
   green play flies the camera into the screen, cue flies back out, the jog scrolls the tracklist. */
var DK = null, three = false;
function deckInit() {
  if (!window.THREE) { document.getElementById('g-hint').textContent = 'The deck needs a connection to load'; return; }
  var T = THREE, host = document.getElementById('three'), R;
  try { R = new T.WebGLRenderer({ antialias: true }); } catch (er) { document.getElementById('g-hint').textContent = 'This browser can’t draw the deck'; return; }
  R.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); R.outputEncoding = T.sRGBEncoding; R.setClearColor(0x050505, 1);
  host.appendChild(R.domElement);
  var S = new T.Scene(), C = new T.PerspectiveCamera(32, 1, .05, 100);
  S.fog = new T.Fog(0x050505, 9, 22);
  S.add(new T.AmbientLight(0x8890a0, .55));
  var kl = new T.DirectionalLight(0xffffff, .6); kl.position.set(-2, 6, 3); S.add(kl);
  var G = new T.Group(); S.add(G);

  function rbox(w, h, d, r) {
    var s = new T.Shape(), x = -w / 2 + r, y = -h / 2 + r, W2 = w - 2 * r, H2 = h - 2 * r;
    s.moveTo(x, y - r); s.lineTo(x + W2, y - r); s.quadraticCurveTo(x + W2 + r, y - r, x + W2 + r, y); s.lineTo(x + W2 + r, y + H2); s.quadraticCurveTo(x + W2 + r, y + H2 + r, x + W2, y + H2 + r);
    s.lineTo(x, y + H2 + r); s.quadraticCurveTo(x - r, y + H2 + r, x - r, y + H2); s.lineTo(x - r, y); s.quadraticCurveTo(x - r, y - r, x, y - r);
    var g = new T.ExtrudeGeometry(s, { depth: d, bevelEnabled: false, curveSegments: 8 }); g.center(); return g;
  }
  function flat(geo) { geo.rotateX(-Math.PI / 2); return geo; }
  var glowTex = (function () { var c = document.createElement('canvas'); c.width = c.height = 128; var x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(.3, 'rgba(255,255,255,.25)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new T.CanvasTexture(c); })();
  function halo(color, size, x, y, z, op) { var s = new T.Sprite(new T.SpriteMaterial({ map: glowTex, color: color, transparent: true, opacity: op || .3, blending: T.AdditiveBlending, depthWrite: false })); s.scale.set(size, size, 1); s.position.set(x, y, z); G.add(s); return s; }

  /* the board inside, seen through the shell: tidy traces on a grid */
  var bc = document.createElement('canvas'); bc.width = 512; bc.height = 640; var bx = bc.getContext('2d');
  bx.fillStyle = '#0c1211'; bx.fillRect(0, 0, 512, 640);
  bx.strokeStyle = 'rgba(150,190,180,.16)'; bx.lineWidth = 2; var rr = rng(42);
  for (var q = 0; q < 46; q++) { bx.beginPath(); var px = Math.round(rr() * 16) * 32, py = Math.round(rr() * 20) * 32; bx.moveTo(px, py); px += (rr() > .5 ? 1 : -1) * 64; bx.lineTo(px, py); py += (rr() > .5 ? 1 : -1) * 96; bx.lineTo(px, py); bx.stroke(); }
  bx.fillStyle = 'rgba(190,200,195,.2)'; for (q = 0; q < 28; q++) bx.fillRect(Math.round(rr() * 15) * 32 + 6, Math.round(rr() * 19) * 32 + 8, 20, 10);
  var btex = new T.CanvasTexture(bc); btex.encoding = T.sRGBEncoding;
  var board = new T.Mesh(flat(new T.PlaneGeometry(3.0, 3.8)), new T.MeshStandardMaterial({ map: btex, roughness: .8 })); board.position.y = -.12; G.add(board);

  /* clear shell */
  var shellG = flat(rbox(3.2, 4.0, .34, .12));
  G.add(new T.Mesh(shellG, new T.MeshStandardMaterial({ color: 0xb8c8d8, transparent: true, opacity: .14, roughness: .1, metalness: .1, depthWrite: false })));
  G.add(new T.LineSegments(new T.EdgesGeometry(shellG, 25), new T.LineBasicMaterial({ color: 0x9fb0c0, transparent: true, opacity: .35 })));

  /* screen */
  var sc = document.createElement('canvas'); sc.width = 1024; sc.height = 600;
  var stex = new T.CanvasTexture(sc); stex.encoding = T.sRGBEncoding; stex.anisotropy = 4;
  var bez = new T.Mesh(flat(rbox(2.0, 1.24, .04, .04)), new T.MeshStandardMaterial({ color: 0x1a1a1a, roughness: .4 })); bez.position.set(0, .19, -1.28); G.add(bez);
  var screen = new T.Mesh(flat(new T.PlaneGeometry(1.86, 1.09)), new T.MeshBasicMaterial({ map: stex, toneMapped: false })); screen.position.set(0, .215, -1.28); G.add(screen);

  /* lit pads, laid out like a real deck: four filter pads under the screen, transport bottom left */
  var PADS = [];
  function pad(x, z, w, d, col, role, round) {
    var geo = round ? new T.CylinderGeometry(w / 2, w / 2, .06, 40) : flat(rbox(w, d, .06, .03));
    var m = new T.Mesh(geo, new T.MeshBasicMaterial({ color: col, transparent: true, opacity: .9 }));
    m.position.set(x, .2, z); m.userData = { role: role, press: 0 }; G.add(m);
    m.userData.h = halo(col, Math.max(w, d) * 1.6, x, .24, z, .22); PADS.push(m); return m;
  }
  function ring(x, z, r, col) { var t = new T.Mesh(new T.TorusGeometry(r, .016, 8, 64), new T.MeshBasicMaterial({ color: col })); t.rotation.x = Math.PI / 2; t.position.set(x, .24, z); G.add(t); return t; }
  for (var p = 0; p < 4; p++) pad(-.69 + p * .46, -.48, .4, .17, 0xF5E02A, 'tag' + p);
  pad(-1.2, .98, .16, .16, 0xEDEDED, 'prev', true); pad(-.94, .98, .16, .16, 0xEDEDED, 'next', true);
  pad(-1.07, 1.36, .34, .34, 0xF07A1A, 'cue', true); ring(-1.07, 1.36, .22, 0xF07A1A);
  pad(-1.07, 1.8, .34, .34, 0x3BE36A, 'play', true); ring(-1.07, 1.8, .22, 0x3BE36A);
  var knob = new T.Mesh(new T.CylinderGeometry(.18, .2, .12, 40), new T.MeshStandardMaterial({ color: 0xdfe6ee, roughness: .3, transparent: true, opacity: .85 })); knob.position.set(1.22, .23, -1.42); G.add(knob);
  var slot = new T.Mesh(flat(new T.PlaneGeometry(.05, 1.4)), new T.MeshBasicMaterial({ color: 0x050505 })); slot.position.set(1.3, .18, .95); G.add(slot);
  var fader = new T.Mesh(new T.BoxGeometry(.22, .1, .14), new T.MeshStandardMaterial({ color: 0x9aa3ad, roughness: .4 })); fader.position.set(1.3, .23, .95); G.add(fader);

  /* jog: clear platter, one ring of light, the helix on the centre disc */
  var jog = new T.Group(); jog.position.set(.08, .2, .72); G.add(jog);
  jog.add(new T.Mesh(new T.CylinderGeometry(.92, .92, .08, 72), new T.MeshStandardMaterial({ color: 0xcfe0f0, transparent: true, opacity: .14, roughness: .05, depthWrite: false })));
  var ringL = new T.Mesh(new T.TorusGeometry(.9, .01, 8, 120), new T.MeshBasicMaterial({ color: 0xbfd8ff, transparent: true, opacity: .6 })); ringL.rotation.x = Math.PI / 2; ringL.position.y = .045; jog.add(ringL);
  var ring2 = new T.Mesh(new T.TorusGeometry(.58, .005, 6, 120), new T.MeshBasicMaterial({ color: 0x7fb8ff, transparent: true, opacity: .3 })); ring2.rotation.x = Math.PI / 2; ring2.position.y = .045; jog.add(ring2);
  var spin = new T.Group(); jog.add(spin);
  var mark = new T.Mesh(new T.BoxGeometry(.03, .02, .14), new T.MeshBasicMaterial({ color: 0xffffff })); mark.position.set(0, .06, -.74); spin.add(mark);
