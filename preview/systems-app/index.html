<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
<div class="splash" id="splash" aria-hidden="true"><span class="swm"><span>S</span><span style="--g:.08em">y</span><span style="--g:.36em">st</span><span style="--g:.14em">e</span><span style="--g:.42em">ms</span></span></div>
<div class="shell">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main id="main" aria-live="polite"></main>
</div>
<div id="tabs"></div>
<div class="shade" id="shade"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="banner" id="banner" role="status"></div>
<script src="config.js"></script>
<script src="jobs.js"></script>
<script src="app.js"></script>
<script>
(function(){var el=document.getElementById("splash");if(!el)return;
var seen=false;try{seen=sessionStorage.getItem("sySplash")==="1";sessionStorage.setItem("sySplash","1")}catch(e){}
var rm=matchMedia("(prefers-reduced-motion: reduce)").matches;
function done(){el.classList.add("out");setTimeout(function(){el.remove()},450)}
if(seen){el.remove();return}
el.classList.add("go");el.addEventListener("click",done);setTimeout(done,rm?700:2700)})();
</script>
</body>
</html>
