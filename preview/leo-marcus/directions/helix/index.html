<!doctype html>
<html lang="en" data-way="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Helical Sound: Helix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&family=Inter+Tight:wght@300;500&display=swap">
<link rel="stylesheet" href="../shared.css">
<style>
/* Helix: the work as a turning spiral of stills (after WAUI), "/." separators (after Riqli),
   lowercase statement and a numbered pager (after Marta Pachar). Two sizes: big names, small everything else. */
:root { --paper: #E6E5E1; }
[data-way="dark"] { --bg: #0E0E0D; }
.caps { text-transform: uppercase; letter-spacing: .06em; }
.sl { opacity: .38; padding: 0 .35em; }
.big { font-weight: 300; letter-spacing: -.055em; }
.stage { position: fixed; inset: 0; perspective: 1500px; overflow: hidden; touch-action: none; cursor: grab; }
.stage.drag { cursor: grabbing; }
.helix { position: absolute; left: 50%; top: 44%; width: 0; height: 0; transform-style: preserve-3d; }
.card { position: absolute; width: var(--cw); aspect-ratio: 2.42; left: calc(var(--cw) / -2); top: calc(var(--cw) / -4.84); background: color-mix(in srgb, var(--fg) 10%, var(--bg)); overflow: hidden; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
:root { --cw: 132px; --rad: 150px; --rise: 40px; }
@media (min-width: 900px) { :root { --cw: 250px; --rad: 330px; --rise: 62px; } }
.stmt { display: none; }
@media (min-width: 900px) { .stmt { display: block; } }
.nav, .stmt { transition: opacity .4s; }
body.p .nav, body.p .stmt { opacity: 0; pointer-events: none; }

.nav { position: fixed; z-index: 40; top: calc(env(safe-area-inset-top, 0px) + var(--pad) + 18px); left: max(var(--pad), env(safe-area-inset-left, 0px)); }
.nav button { opacity: .38; transition: opacity .2s; }
.nav button[aria-pressed="true"], .nav button:hover { opacity: 1; }
.stmt { position: fixed; z-index: 30; right: max(var(--pad), env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + var(--pad) + 18px); max-width: 24ch; text-align: right; opacity: .38; }
.now { position: fixed; z-index: 30; left: max(var(--pad), env(safe-area-inset-left, 0px)); right: max(var(--pad), env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 48px); pointer-events: none; }
.now .big { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-bottom: .06em; }
.now .ln { margin-top: 6px; }
.now .big, .now .ln { transition: opacity .25s; }
.now.swap .big, .now.swap .ln { opacity: 0; }

/* project view */
.proj { position: fixed; inset: 0; z-index: 36; background: var(--bg); display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 56px) max(var(--pad), env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 52px) max(var(--pad), env(safe-area-inset-left, 0px)); gap: 14px; clip-path: inset(50% 50% 50% 50%); transition: clip-path .8s var(--ease); pointer-events: none; overflow-y: auto; }
.proj.open { clip-path: inset(0 0 0 0); pointer-events: auto; }
.proj .film { width: 100%; max-width: 1100px; aspect-ratio: 2.42; flex: none; cursor: pointer; }
.proj .big { padding-bottom: .06em; }
.meta { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 4px 28px; }
.meta dt { opacity: .38; }
.meta dd { margin: 0; }
.bar { height: 1px; background: color-mix(in srgb, var(--fg) 20%, transparent); position: relative; max-width: 1100px; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--fg); }
.pager { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: auto; }
.pager button { opacity: .38; }
.pager button[aria-current="true"], .pager button:hover { opacity: 1; }
.proj .ctl { display: flex; gap: 18px; }
@media (min-width: 900px) {
  .proj { display: grid; grid-template-columns: 1fr 30vw; grid-template-rows: auto auto auto 1fr auto; column-gap: 32px; }
  .proj .film { grid-column: 1; grid-row: 1 / 4; }
  .proj .big { grid-column: 2; grid-row: 1; }
  .proj .meta { grid-column: 2; grid-row: 2; grid-template-columns: auto; }
  .proj .ctl { grid-column: 2; grid-row: 3; }
  .proj .bar { grid-column: 1; grid-row: 4; align-self: start; }
  .pager { grid-column: 1 / 3; grid-row: 5; }
}
</style>
</head>
<body>
<div class="ways" aria-label="Colourway">
  <button type="button" data-way-btn="ink" aria-label="Grey and ink"></button>
  <button type="button" data-way-btn="red" aria-label="Grey and red"></button>
  <button type="button" data-way-btn="dark" aria-label="Ink and paper"></button>
</div>
<a class="corner tl" href="#" id="home">Helical Sound®</a>
<button type="button" class="corner tr" id="tr">Info</button>
<a class="corner bl" href="mailto:hello@helical-sound.com">hello@helical-sound.com</a>
<a class="corner br" href="https://eltio.studio" target="_blank" rel="noopener">Site by Eltio Studio</a>
<nav class="nav caps" id="nav" aria-label="Filter by work"></nav>
<p class="stmt" id="stmt">music and sound for fashion and advertising, made in london.</p>

<div class="stage" id="stage"><div class="helix" id="helix"></div></div>
<div class="now" id="now" aria-live="polite"><span class="big" id="nc"></span><div class="ln caps" id="nl"></div></div>

<section class="proj" id="proj" aria-label="Project">
  <div class="film" id="pf"><img alt=""></div>
  <h1 class="big" id="pc" style="margin:0"></h1>
  <dl class="meta caps" id="pm"></dl>
  <div class="ctl caps"><button type="button" id="pp">Pause</button><span id="pt">00:00</span></div>
  <div class="bar"><i id="pb"></i></div>
  <nav class="pager caps" id="pg" aria-label="Projects"></nav>
</section>

<section class="info" id="info" aria-label="Info">
  <p>Helical Sound is a London-based music and sound studio creating bespoke music and sound design for fashion and advertising.</p>
  <p>Leo Marcus<br><a href="mailto:hello@helical-sound.com">hello@helical-sound.com</a><br><a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a></p>
</section>

<script src="../shared.js"></script>
<script>
var tag = 'all', list = [], cards = [], step = 0, off = 0, target = 0, front = -1, lastTouch = 0;
var H = document.getElementById('helix'), S = document.getElementById('stage');
function px(v) { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue(v)); }
function pad(n) { return (n < 9 ? '0' : '') + (n + 1); }
function build() {
  var h = '';
  ['all'].concat(TAG_ORDER).forEach(function (k, j) {
    h += (j ? '<span class="sl">/.</span>' : '') + '<button type="button" data-tag="' + k + '" aria-pressed="' + (k === tag) + '">' + (k === 'all' ? 'All' : TAGS[k]) + '</button>';
  });
  document.getElementById('nav').innerHTML = h;
  list = tag === 'all' ? WORK.slice() : WORK.filter(function (w) { return w.t.indexOf(tag) > -1; });
  step = 360 / list.length;
  h = '';
  for (var i = 0; i < list.length * 3; i++) h += '<div class="card" data-i="' + (i % list.length) + '"><img alt="" src="' + still(list[i % list.length]) + '"></div>';
  H.innerHTML = h; cards = [].slice.call(H.children);
  off = target = list.length; front = -1;
}
function frame() {
  if (performance.now() - lastTouch > 2200 && !proj.classList.contains('open')) target += .0035;
  off += (target - off) * .085;
  var n = list.length;
  if (off > 2 * n) { off -= n; target -= n; } else if (off < n) { off += n; target += n; }
  var R = px('--rad'), rise = px('--rise'), wide = innerWidth >= 900;
  H.style.transform = 'rotateZ(' + (wide ? -16 : -22) + 'deg) rotateX(-10deg) translateY(' + (-off * rise) + 'px) rotateY(' + (-off * step) + 'deg)';
  cards.forEach(function (c, i) {
    var d = i - off, a = d * step * Math.PI / 180, facing = (Math.cos(a) + 1) / 2, fade = Math.max(0, 1 - Math.abs(d) / (n * .9));
    c.style.transform = 'translateY(' + (i * rise) + 'px) rotateY(' + (i * step) + 'deg) translateZ(' + R + 'px)';
    c.style.opacity = (fade * (Math.abs(d) < .5 ? 1 : .12 + .6 * Math.pow(facing, 3))).toFixed(3);
    c.style.zIndex = Math.round(facing * 100);
  });
  var f = ((Math.round(off) % n) + n) % n;
  if (f !== front) setFront(f);
  requestAnimationFrame(frame);
}
var now = document.getElementById('now'), swapT;
function setFront(f) {
  front = f; now.classList.add('swap'); clearTimeout(swapT);
  swapT = setTimeout(function () {
    var w = list[f];
    document.getElementById('nc').textContent = w.c;
    document.getElementById('nl').innerHTML = w.p + '<span class="sl">/.</span>' + pad(f) + '—' + pad(list.length - 1);
    now.classList.remove('swap');
  }, 180);
}
/* scroll, drag and tap */
addEventListener('wheel', function (e) { if (proj.classList.contains('open') || info.classList.contains('open')) return; target += (e.deltaY + e.deltaX) * .0035; lastTouch = performance.now(); }, { passive: true });
var down = null;
S.addEventListener('pointerdown', function (e) { down = { x: e.clientX, y: e.clientY, t: target, moved: 0 }; S.setPointerCapture(e.pointerId); S.classList.add('drag'); lastTouch = performance.now(); });
S.addEventListener('pointermove', function (e) {
  if (!down) return; var dx = e.clientX - down.x, dy = e.clientY - down.y;
  down.moved = Math.max(down.moved, Math.abs(dx) + Math.abs(dy));
  target = down.t - (dx + dy) / (innerWidth >= 900 ? 120 : 70); lastTouch = performance.now();
});
S.addEventListener('pointerup', function (e) {
  S.classList.remove('drag'); if (!down) return;
  var moved = down.moved; down = null;
  if (moved > 6) { target = Math.round(target); return; }
  S.releasePointerCapture(e.pointerId);
  var el = document.elementFromPoint(e.clientX, e.clientY), c = el && el.closest('.card');
  if (c) openP(+c.getAttribute('data-i'));
});
document.getElementById('nav').addEventListener('click', function (e) { var b = e.target.closest('[data-tag]'); if (b) { tag = b.getAttribute('data-tag'); build(); } });

/* project view */
var proj = document.getElementById('proj'), cur = 0, playing = false, t0 = 0, pos = 0, pf = document.getElementById('pf');
function openP(i) {
  cur = i; var w = list[i];
  pf.querySelector('img').src = still(w);
  document.getElementById('pc').textContent = w.c;
  document.getElementById('pm').innerHTML = '<div><dt>Project</dt><dd>' + w.p + '</dd></div><div><dt>Work</dt><dd>' + credits(w) + '</dd></div><div><dt>Length</dt><dd>' + w.d + '</dd></div>';
  var h = '';
  list.forEach(function (x, j) { h += '<button type="button" data-j="' + j + '" aria-current="' + (j === i) + '">' + pad(j) + '</button>'; });
  document.getElementById('pg').innerHTML = h + '<button type="button" data-j="' + ((i + 1) % list.length) + '">Next</button>';
  proj.classList.add('open'); document.body.classList.add('p'); tr.textContent = 'Close';
  pos = 0; play(false); setTimeout(function () { play(true); }, 500);
  target = Math.round(off) + (((i - front) % list.length) + list.length) % list.length;
}
function play(on) { playing = on; t0 = performance.now() - pos * 1000; pf.classList.toggle('on', on); document.getElementById('pp').textContent = on ? 'Pause' : 'Play'; if (on) tick(); }
function tick() {
  if (!playing || !proj.classList.contains('open')) return;
  var len = secs(list[cur].d); pos = (performance.now() - t0) / 1000;
  if (pos >= len) { openP((cur + 1) % list.length); return; }
  document.getElementById('pb').style.width = pos / len * 100 + '%';
  document.getElementById('pt').textContent = clock(pos) + ' / ' + list[cur].d;
  requestAnimationFrame(tick);
}
function closeP() { proj.classList.remove('open'); document.body.classList.remove('p'); playing = false; pf.classList.remove('on'); tr.textContent = 'Info'; lastTouch = performance.now(); }
document.getElementById('pg').addEventListener('click', function (e) { var b = e.target.closest('[data-j]'); if (b) openP(+b.getAttribute('data-j')); });
document.getElementById('pp').onclick = function () { play(!playing); };
pf.onclick = function () { play(!playing); };

var info = document.getElementById('info'), tr = document.getElementById('tr');
tr.onclick = function () {
  if (proj.classList.contains('open')) return closeP();
  var o = info.classList.toggle('open'); tr.textContent = o ? 'Close' : 'Info';
};
document.getElementById('home').onclick = function (e) { e.preventDefault(); info.classList.remove('open'); closeP(); };
build(); requestAnimationFrame(frame);
</script>
</body>
</html>
