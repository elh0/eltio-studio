<!doctype html>
<html lang="en" data-way="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Helical Sound: Helix + Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&family=Inter+Tight:wght@300;500&family=Archivo+Narrow:wght@500&display=swap">
<link rel="stylesheet" href="../shared.css">
<style>
/* Helix + Index (from the call, 26 Oct): the helix is the landing. One click un-helixes it:
   every still drops flat into its row and the page becomes a quiet left-aligned list.
   No zoom into a project; a row opens its film in place. The pal.tv footer is pinned throughout. */
:root { --paper: #E6E5E1; --lbig: clamp(30px, 6.4vw, 92px); --tbig: clamp(30px, 4.6vw, 64px); --cond: "Archivo Narrow", "Arial Narrow", sans-serif; --line: color-mix(in srgb, var(--fg) 16%, transparent); --thumb: 74px; }
@media (min-width: 900px) { :root { --thumb: 9vw; } }
[data-way="dark"] { --bg: #0E0E0D; }
.caps { text-transform: uppercase; letter-spacing: .06em; }
.sl { opacity: .38; padding: 0 .35em; }
.big { font-weight: 300; letter-spacing: -.055em; }

/* top row: filter left, colourways centre, mode switch right */
.nav { position: fixed; z-index: 40; top: calc(env(safe-area-inset-top, 0px) + var(--pad) + 18px); left: max(var(--pad), env(safe-area-inset-left, 0px)); }
.nav button { opacity: .38; transition: opacity .2s; }
.nav button[aria-pressed="true"], .nav button:hover { opacity: 1; }
.band { position: fixed; z-index: 39; left: 0; right: 0; top: 0; height: calc(env(safe-area-inset-top, 0px) + var(--pad) + 44px); background: var(--bg); border-bottom: 1px solid var(--line); opacity: 0; pointer-events: none; transition: opacity .6s var(--ease), background .5s var(--ease); }
body.list .band { opacity: 1; }

/* helix */
.stage { position: fixed; inset: 0 0 var(--foot, 150px); perspective: 1500px; overflow: hidden; touch-action: none; cursor: grab; transition: opacity .5s var(--ease); }
.stage.drag { cursor: grabbing; }
.helix { position: absolute; left: 50%; top: 46%; width: 0; height: 0; transform-style: preserve-3d; }
.card { position: absolute; width: var(--cw); aspect-ratio: 2.42; left: calc(var(--cw) / -2); top: calc(var(--cw) / -4.84); background: color-mix(in srgb, var(--fg) 10%, var(--bg)); overflow: hidden; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
:root { --cw: 132px; --rad: 150px; --rise: 36px; }
@media (min-width: 900px) { :root { --cw: 240px; --rad: 320px; --rise: 54px; } }
.now { position: fixed; z-index: 30; left: max(var(--pad), env(safe-area-inset-left, 0px)); right: max(var(--pad), env(safe-area-inset-right, 0px)); bottom: calc(var(--foot, 150px) + 22px); pointer-events: none; transition: opacity .4s var(--ease); }
.now .big { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-bottom: .06em; }
.now .ln { margin-top: 6px; }
.now .big, .now .ln { transition: opacity .25s; }
.now.swap .big, .now.swap .ln { opacity: 0; }
body.list .stage, body.list .now { opacity: 0; pointer-events: none; }

/* the list */
.scroll { position: fixed; inset: 0 0 var(--foot, 150px); overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + var(--pad) + 60px) max(var(--pad), env(safe-area-inset-right, 0px)) 40px max(var(--pad), env(safe-area-inset-left, 0px)); opacity: 0; pointer-events: none; transition: opacity .5s var(--ease); }
body.list .scroll { opacity: 1; pointer-events: auto; }
.row { border-bottom: 1px solid var(--line); }
.row .head { display: grid; width: 100%; text-align: left; grid-template-columns: var(--thumb) minmax(0, 1fr); column-gap: 14px; align-items: center; padding: 8px 0; }
.row .th { width: var(--thumb); aspect-ratio: 2.42; overflow: hidden; background: color-mix(in srgb, var(--fg) 8%, var(--bg)); }
.row .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
body.flying .row .th img { opacity: 0; }
.row .c { font: 300 var(--lbig)/.95 var(--sans); letter-spacing: -.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-bottom: .05em; transition: opacity .35s var(--ease); }
.row .meta { grid-column: 2; opacity: .45; margin-top: 4px; }
.row .meta .cr { display: none; }
@media (min-width: 900px) {
  .row .head { grid-template-columns: var(--thumb) minmax(0, 1fr) 22vw; column-gap: 22px; }
  .row .meta { grid-column: 3; margin: 0; display: grid; gap: 2px; }
  .row .meta .cr { display: block; }
}
.row .txt, .row .meta { transform: translateY(14px); opacity: 0; transition: transform .7s var(--ease), opacity .7s var(--ease); transition-delay: calc(var(--k, 0) * 30ms + 250ms); }
body.list .row .txt { transform: none; opacity: 1; }
body.list .row .meta { transform: none; opacity: .45; }
.lst:hover .row:not(:hover):not(.open) .c, .lst.has-open .row:not(.open) .c { opacity: .3; }
.drawer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .8s var(--ease); }
.drawer > div { overflow: hidden; min-height: 0; }
.row.open .drawer { grid-template-rows: 1fr; }
.inner { display: grid; gap: 10px; padding: 6px 0 26px; }
@media (min-width: 900px) { .inner { padding-left: calc(var(--thumb) + 22px); padding-right: calc(22vw + 22px); } }
.inner .film { width: 100%; aspect-ratio: 2.42; cursor: pointer; }
.ctl { display: flex; justify-content: space-between; gap: 12px; }
.bar { height: 1px; background: var(--line); position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--fg); }
.fly { position: fixed; z-index: 45; overflow: hidden; pointer-events: none; background: color-mix(in srgb, var(--fg) 10%, var(--bg)); transition: left .9s var(--ease), top .9s var(--ease), width .9s var(--ease), height .9s var(--ease), opacity .9s var(--ease); }
.fly img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* the pinned footer, after pal.tv */
.foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--bg); border-top: 1px solid var(--fg); display: grid; grid-template-columns: 1fr 1fr; padding: 0 max(var(--pad), env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(var(--pad), env(safe-area-inset-left, 0px)); font-family: var(--sans); transition: background .5s var(--ease); }
.foot > * { padding: 12px 0 14px; }
.foot .wm { grid-column: 1 / -1; font: 500 var(--tbig)/.9 var(--cond); padding-bottom: 8px; }
.foot .bio { display: none; }
.foot .ct { padding-top: 10px; border-top: 1px solid var(--line); }
.foot .ct + .ct { padding-left: 12px; border-left: 1px solid var(--fg); }
.foot a:hover { opacity: .5; }
.foot .q2 { opacity: .45; }
@media (min-width: 900px) {
  .foot { grid-template-columns: 1.05fr 1.2fr .5fr .5fr; }
  .foot > * { padding: 14px 16px 18px; border-left: 1px solid var(--fg); }
  .foot > :first-child { border-left: 0; padding-left: 0; }
  .foot .wm { grid-column: auto; }
  .foot .bio { display: block; margin: 0; }
  .foot .ct { border-top: 0; padding-top: 14px; }
  .foot .ct + .ct { padding-left: 16px; }
}
</style>
</head>
<body>
<div class="band"></div>
<div class="ways" aria-label="Colourway">
  <button type="button" data-way-btn="ink" aria-label="Grey and ink"></button>
  <button type="button" data-way-btn="red" aria-label="Grey and red"></button>
  <button type="button" data-way-btn="dark" aria-label="Ink and paper"></button>
</div>
<nav class="nav caps" id="nav" aria-label="Filter by work"></nav>
<button type="button" class="corner tr caps" id="mode" style="top:calc(env(safe-area-inset-top, 0px) + 18px)">List ↓</button>

<div class="stage" id="stage"><div class="helix" id="helix"></div></div>
<div class="now" id="now" aria-live="polite"><span class="big" id="nc"></span><div class="ln caps" id="nl"></div></div>

<div class="scroll" id="scroll"><div class="lst" id="lst"></div></div>

<footer class="foot" id="foot">
  <a href="#" class="wm" id="home">Helical Sound</a>
  <p class="bio">A London-based music and sound studio creating bespoke music and sound design for fashion and advertising.</p>
  <div class="ct"><span class="q2">Contact</span><br>Leo Marcus<br><a href="mailto:hello@helical-sound.com">hello@helical-sound.com</a></div>
  <div class="ct"><a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a><br><a href="https://vimeo.com" target="_blank" rel="noopener">Vimeo</a><br><a class="q2" href="https://eltio.studio" target="_blank" rel="noopener">Site by Eltio Studio</a></div>
</footer>

<script src="../shared.js"></script>
<script>
var tag = 'all', list = [], cards = [], step = 0, off = 0, target = 0, front = -1, lastTouch = 0, mode = 'helix';
var H = document.getElementById('helix'), S = document.getElementById('stage'), LS = document.getElementById('lst'), SC = document.getElementById('scroll');
function px(v) { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue(v)); }
function pad(n) { return (n < 9 ? '0' : '') + (n + 1); }
function build() {
  var h = '';
  ['all'].concat(TAG_ORDER).forEach(function (k, j) {
    h += (j ? '<span class="sl">/.</span>' : '') + '<button type="button" data-tag="' + k + '" aria-pressed="' + (k === tag) + '">' + (k === 'all' ? 'All' : TAGS[k]) + '</button>';
  });
  document.getElementById('nav').innerHTML = h;
  list = tag === 'all' ? WORK.slice() : WORK.filter(function (w) { return w.t.indexOf(tag) > -1; });
  step = 360 / list.length;
  h = '';
  for (var i = 0; i < list.length * 3; i++) h += '<div class="card" data-i="' + (i % list.length) + '"><img alt="" src="' + still(list[i % list.length]) + '"></div>';
  H.innerHTML = h; cards = [].slice.call(H.children);
  off = target = list.length; front = -1;
  h = '';
  list.forEach(function (w, i) {
    h += '<div class="row" data-i="' + i + '" style="--k:' + i + '"><button type="button" class="head" aria-expanded="false"><span class="th"><img alt="" src="' + still(w) + '"></span>' +
      '<span class="txt"><span class="c" style="display:block">' + w.c + '</span></span>' +
      '<span class="meta caps"><span>↳ ' + w.p + '</span><span class="cr">' + credits(w) + '</span></span></button>' +
      '<div class="drawer"><div><div class="inner"><div class="film"><img alt="" loading="lazy" src="' + still(w) + '"></div><div class="bar"><i></i></div>' +
      '<div class="ctl caps"><button type="button" data-k="play">Play</button><span class="tm">00:00 / ' + w.d + '</span><span><button type="button" data-k="prev">Prev</button> &nbsp; <button type="button" data-k="next">Next</button></span></div></div></div></div></div>';
  });
  LS.innerHTML = h; openI = -1; LS.classList.remove('has-open');
}
function frame() {
  if (mode === 'helix') {
    if (performance.now() - lastTouch > 2200) target += .0035;
    off += (target - off) * .085;
    var n = list.length;
    if (off > 2 * n) { off -= n; target -= n; } else if (off < n) { off += n; target += n; }
    var R = px('--rad'), rise = px('--rise'), wide = innerWidth >= 900;
    H.style.transform = 'rotateZ(' + (wide ? -16 : -22) + 'deg) rotateX(-10deg) translateY(' + (-off * rise) + 'px) rotateY(' + (-off * step) + 'deg)';
    cards.forEach(function (c, i) {
      var d = i - off, a = d * step * Math.PI / 180, facing = (Math.cos(a) + 1) / 2, fade = Math.max(0, 1 - Math.abs(d) / (n * .9));
      c.style.transform = 'translateY(' + (i * rise) + 'px) rotateY(' + (i * step) + 'deg) translateZ(' + R + 'px)';
      c.style.opacity = (fade * (Math.abs(d) < .5 ? 1 : .12 + .6 * Math.pow(facing, 3))).toFixed(3);
      c.style.zIndex = Math.round(facing * 100);
    });
    var f = ((Math.round(off) % n) + n) % n;
    if (f !== front) setFront(f);
  }
  requestAnimationFrame(frame);
}
var now = document.getElementById('now'), swapT;
function setFront(f) {
  front = f; now.classList.add('swap'); clearTimeout(swapT);
  swapT = setTimeout(function () {
    var w = list[f];
    document.getElementById('nc').textContent = w.c;
    document.getElementById('nl').innerHTML = w.p + '<span class="sl">/.</span>' + pad(f) + '—' + pad(list.length - 1);
    now.classList.remove('swap');
  }, 180);
}

/* un-helix: each still flies from where it sits on the spiral into its row */
function toList(open) {
  if (mode === 'list') return;
  mode = 'list'; stopP(); SC.scrollTop = 0;
  var n = list.length, src = [];
  for (var j = 0; j < n; j++) {
    var best = null, bd = 1e9;
    cards.forEach(function (c, i) { if (i % n === j && Math.abs(i - off) < bd) { bd = Math.abs(i - off); best = c; } });
    src.push({ r: best.getBoundingClientRect(), o: +best.style.opacity });
  }
  document.body.classList.add('flying', 'list');
  document.getElementById('mode').textContent = 'Helix ↺';
  var thumbs = LS.querySelectorAll('.th'), flies = [];
  src.forEach(function (s, j) {
    var f = document.createElement('div'); f.className = 'fly';
    f.innerHTML = '<img alt="" src="' + still(list[j]) + '">';
    f.style.cssText = 'left:' + s.r.left + 'px;top:' + s.r.top + 'px;width:' + s.r.width + 'px;height:' + s.r.width / 2.42 + 'px;opacity:' + Math.max(.15, s.o) + ';transition-delay:' + j * 28 + 'ms';
    document.body.appendChild(f); flies.push(f);
  });
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    flies.forEach(function (f, j) {
      var t = thumbs[j].getBoundingClientRect(), offscreen = t.top > innerHeight;
      f.style.left = t.left + 'px'; f.style.top = (offscreen ? innerHeight + 20 : t.top) + 'px';
      f.style.width = t.width + 'px'; f.style.height = t.height + 'px'; f.style.opacity = 1;
    });
  }); });
  setTimeout(function () {
    document.body.classList.remove('flying');
    flies.forEach(function (f) { f.remove(); });
    if (open > -1) setOpen(open, true);
  }, 900 + n * 28 + 60);
}
function toHelix() {
  if (mode === 'helix') return;
  setOpen(-1); mode = 'helix'; lastTouch = 0;
  document.body.classList.remove('list');
  document.getElementById('mode').textContent = 'List ↓';
}
document.getElementById('mode').onclick = function () { mode === 'helix' ? toList(-1) : toHelix(); };

/* helix: scroll, drag, and a tap on any still goes straight to the list */
addEventListener('wheel', function (e) { if (mode !== 'helix') return; target += (e.deltaY + e.deltaX) * .0035; lastTouch = performance.now(); }, { passive: true });
var down = null;
S.addEventListener('pointerdown', function (e) { down = { x: e.clientX, y: e.clientY, t: target, moved: 0 }; S.setPointerCapture(e.pointerId); S.classList.add('drag'); lastTouch = performance.now(); });
S.addEventListener('pointermove', function (e) {
  if (!down) return; var dx = e.clientX - down.x, dy = e.clientY - down.y;
  down.moved = Math.max(down.moved, Math.abs(dx) + Math.abs(dy));
  target = down.t - (dx + dy) / (innerWidth >= 900 ? 120 : 70); lastTouch = performance.now();
});
S.addEventListener('pointerup', function (e) {
  S.classList.remove('drag'); if (!down) return;
  var moved = down.moved; down = null;
  if (moved > 6) { target = Math.round(target); return; }
  S.releasePointerCapture(e.pointerId);
  var el = document.elementFromPoint(e.clientX, e.clientY), c = el && el.closest('.card');
  if (c) toList(+c.getAttribute('data-i'));
});
document.getElementById('nav').addEventListener('click', function (e) { var b = e.target.closest('[data-tag]'); if (b) { stopP(); tag = b.getAttribute('data-tag'); build(); } });

/* list: a row opens its film in place */
var openI = -1, playing = false, t0 = 0, pos = 0;
function rows() { return LS.querySelectorAll('.row'); }
function setOpen(i, scroll) {
  stopP();
  rows().forEach(function (r, j) { r.classList.toggle('open', j === i); r.querySelector('.head').setAttribute('aria-expanded', j === i); });
  openI = i; LS.classList.toggle('has-open', i > -1);
  if (i > -1) {
    pos = 0; setTimeout(function () { play(true); }, 500);
    if (scroll) setTimeout(function () { var r = rows()[i]; SC.scrollTo({ top: r.offsetTop - parseFloat(getComputedStyle(SC).paddingTop) + 4, behavior: 'smooth' }); }, 120);
  }
}
function stopP() { playing = false; LS.querySelectorAll('.film').forEach(function (f) { f.classList.remove('on'); }); LS.querySelectorAll('[data-k=play]').forEach(function (b) { b.textContent = 'Play'; }); }
function play(on) {
  var r = rows()[openI]; if (!r) return;
  playing = on; t0 = performance.now() - pos * 1000;
  r.querySelector('.film').classList.toggle('on', on); r.querySelector('[data-k=play]').textContent = on ? 'Pause' : 'Play';
  if (on) tick();
}
function tick() {
  var r = rows()[openI]; if (!r || !playing) return;
  var len = secs(list[openI].d); pos = (performance.now() - t0) / 1000;
  if (pos >= len) { setOpen((openI + 1) % list.length, true); return; }
  r.querySelector('.bar i').style.width = pos / len * 100 + '%';
  r.querySelector('.tm').textContent = clock(pos) + ' / ' + list[openI].d;
  requestAnimationFrame(tick);
}
LS.addEventListener('click', function (e) {
  var k = e.target.closest('[data-k]'), r = e.target.closest('.row'); if (!r) return;
  var i = +r.getAttribute('data-i');
  if (k) {
    var a = k.getAttribute('data-k');
    if (a === 'play') play(!playing);
    if (a === 'next') setOpen((i + 1) % list.length, true);
    if (a === 'prev') setOpen((i - 1 + list.length) % list.length, true);
    return;
  }
  if (e.target.closest('.head')) setOpen(openI === i ? -1 : i, false);
  else if (e.target.closest('.film')) play(!playing);
});
document.getElementById('home').onclick = function (e) { e.preventDefault(); toHelix(); };
function fit() { document.documentElement.style.setProperty('--foot', document.getElementById('foot').offsetHeight + 'px'); }
addEventListener('resize', fit); document.fonts && document.fonts.ready.then(fit);
build(); fit(); requestAnimationFrame(frame);
</script>
</body>
</html>
